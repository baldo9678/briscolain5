  if(G.trump>=0 && G.caller===ME && G.hands[ME].includes(G.calledCard) && !G.revealed) sec='<span class="secret">La carta chiamata è tua: giochi da solo</span>';
  mh.innerHTML=`<span class="nm">La tua mano</span><span class="badges">${badges(ME)}</span>${bubble(ME)}${sec}`;
}
function renderNet(){
  if(!NET.room) return `<p>Il tavolo online non è disponibile: ${esc(NET.why||'collegamento in corso')}.</p>`;
  const peers=NET.room.peers(), conn=NET.room.connected();
  let h=`<p class="note" style="margin:0 0 10px">${conn?'Connesso':'Connessione in corso…'} · ${peers.length} ${peers.length===1?'persona':'persone'} su questa pagina</p>`;
  const seatRow=(p,btn)=>`<div class="bar" style="grid-template-columns:28px 1fr auto"><span class="v" style="text-align:left">${p+1}</span><span>${esc(nm(p))}${G.seats&&G.seats[p]&&G.seats[p].kind==='cpu'?' <span class="bdg">CPU</span>':''}</span>${btn||'<span></span>'}</div>`;
  if(NET.mode==='solo'){
    h+=`<p>Crea un tavolo e manda il link agli amici: si siedono al posto delle CPU senza bisogno di account. Il motore della partita gira nel tuo browser, quindi tienilo aperto finché giocate.</p><p style="margin:10px 0"><button class="btn primary" data-act="m-host">Crea un tavolo</button></p><p class="note">Per entrare nel tavolo di un amico usa il pulsante Menu e scrivi il suo codice.</p>`;
  } else if(NET.mode==='host'){
    h+='<div class="reads" style="gap:4px">';
    for(let p=0;p<5;p++) h+=seatRow(p, p>0&&G.seats[p].kind==='human'?`<button class="btn" data-act="kick" data-seat="${p}">Libera</button>`:'');
    h+=`</div>${inviteHTML()}<p class="note">I posti liberi li gioca la CPU. Se un amico chiude la pagina, il suo posto torna alla CPU.</p><p style="margin-top:10px"><button class="btn" data-act="closetable">Chiudi il tavolo</button></p>`;
  } else {
    h+='<div class="reads" style="gap:4px">';
    for(let p=0;p<5;p++){
      let btn='';
      if(seated() && p===ME) btn='<button class="btn" data-act="stand">Alzati</button>';
      else if(!seated() && p>0 && G.seats[p].kind==='cpu') btn=`<button class="btn primary" data-act="sit" data-seat="${p}">Siediti</button>`;
      h+=seatRow(p,btn);
    }
    h+='</div>';
    if(Date.now()-NET.lastState>15000) h+='<p class="note">Nessun aggiornamento da chi ospita il tavolo da oltre 15 secondi.</p>';
  }
  if(NET.err) h+=`<p class="note" style="color:var(--lose)">${esc(NET.err)}</p>`;
  h+=NET.mode==='host'?`<p class="note">Ognuno vede solo le proprie carte: le mani viaggiano cifrate per ogni giocatore, ma il tuo browser le conosce tutte, come un mazziere.</p>`
    :`<p class="note">Ognuno vede solo le proprie carte.</p>`;
  return h;
}
function renderSide(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===G.tab)));
  const pn=$('#pane'); let h='';
  if(G.tab==='net') h=renderNet();
  else if(G.tab==='log'){
    h='<div class="log">'+G.log.slice().reverse().map(e=>`<div class="e ${e.cls}">${fmt(e.html)}</div>`).join('')+'</div>';
  } else if(G.tab==='out'){
    const mine=seated()?G.hands[ME]:[];
    h='<div class="grid40"><span></span>'+AUCT.map(r=>`<span class="h">${r+1}</span>`).join('');
    for(let s=0;s<4;s++){
      h+=`<span class="h r">${si(s)}</span>`;
      for(const r of AUCT){ const c=s*10+r, cl=['cell']; if(G.seen[c]) cl.push('out'); else if(mine.includes(c)) cl.push('mine'); if(c===G.calledCard) cl.push('called');
        h+=`<span class="${cl.join(' ')}" title="${cardName(c)}">${r+1}</span>`; }
    }
    h+='</div><p class="note">Barrate: già giocate. Bordo verde: in mano a te. Bordo oro: carta chiamata.</p>';
    let out=0; for(let c=0;c<40;c++) if(G.seen[c]) out+=PTS[c];
    const inTrick=G.trick.reduce((x,y)=>x+PTS[y.c],0), taken=out-inTrick;
    h+=`<p class="note">Punti già presi: <b>${taken}</b> · in tavola: <b>${inTrick}</b> · ancora da giocare: <b>${120-out}</b></p>`;
    if(G.trump>=0){
      const left=[0,2,9,8,7,6,5,4,3,1].map(r=>G.trump*10+r).filter(c=>!G.seen[c]);
      const mineT=left.filter(c=>mine.includes(c)).length;
      h+=`<p class="note">Briscole ancora fuori: <b>${left.length}</b> (${mineT} tue) · ${left.map(c=>`<b>${c%10+1}</b>`).join(' ')}</p>`;
    }
  } else if(G.tab==='reads'){
    if(NET.mode==='client'||NET.mode==='watch') h='<p class="note">Le letture delle CPU si vedono solo nel browser di chi ospita il tavolo.</p>';
    else if(NET.mode==='host' && G.seats.some((s,i)=>i>0&&s.kind==='human')) h='<p class="note">Con altri giocatori al tavolo le letture delle CPU restano nascoste: sarebbero un vantaggio sugli amici.</p>';
    else if(!G.showReads) h=`<p>Qui vedi come ogni CPU stima chi sia il socio, aggiornando le probabilità a ogni carico e a ogni presa. Rivela informazioni nascoste, quindi è disattivato di default.</p><p style="margin-top:10px"><button class="btn" data-act="reads">Mostra letture (spoiler)</button></p>`;
    else if(G.phase!=='play' && G.phase!=='end') h='<p class="note">Le letture partono dopo la dichiarazione del seme.</p>';
    else {
      h='<div class="reads">';
      for(let o=1;o<5;o++){
        const b=G.bel[o]; h+=`<div class="read"><h4>${esc(nm(o))}</h4>`;
        if(G.revealed||!b) h+='<p class="note" style="margin:0">Squadre ormai note.</p>';
        else if(b.known) h+=`<p class="note" style="margin:0">${o===G.caller?'Sa di giocare da solo.':'Sa di essere il socio.'}</p>`;
        else b.hyps.map((q,i)=>({q,w:b.w[i]})).sort((x,y)=>y.w-x.w).forEach(({q,w})=>{
          h+=`<div class="bar"><span>${esc(q===G.caller?nm(q)+' (solo)':nm(q))}</span><span class="tr"><span class="fl" style="width:${(w*100).toFixed(0)}%"></span></span><span class="v">${Math.round(w*100)}%</span></div>`;
        });
        h+='</div>';
      }
      h+='</div><p class="note">Ogni barra è la probabilità che quel giocatore sia il socio, secondo la CPU indicata.</p><p style="margin-top:8px"><button class="btn" data-act="reads">Nascondi letture</button></p>';
    }
  } else if(G.tab==='score'){
    const ord=[0,1,2,3,4].sort((a,b)=>G.scores[b]-G.scores[a]);
    h='<table class="sc"><thead><tr><th>Giocatore</th><th style="text-align:right">Punti</th></tr></thead><tbody>'+
      ord.map(q=>`<tr><td>${esc(nm(q))}</td><td class="n ${G.scores[q]>0?'pos':G.scores[q]<0?'neg':''}">${G.scores[q]>0?'+':''}${G.scores[q]}</td></tr>`).join('')+'</tbody></table>';
    h+='<p class="note">Chiamante ±2, socio ±1, difensori ∓1 ciascuno. Da solo: ±4.</p>';
    if(G.history.length) h+='<div class="hist">'+G.history.map(x=>{const m=seated()&&x.d?x.d[ME]:0; return `<div>Mano ${x.n}: ${esc(nm(x.caller))} chiama ${cnHTML(x.card)} (${x.target}) · ${x.cp} punti · ${x.win?'vinta':'persa'}${seated()?` · per te <b class="${m>0?'pos':m<0?'neg':''}">${m>0?'+':''}${m}</b>`:''}</div>`;}).join('')+'</div>';
  }
  pn.innerHTML=h;
}
function render(){ if(!G) return; renderInfo();renderSeats();renderFelt();renderAction();renderHand();renderSide(); broadcast(); }

/* Modali */
function openModal(html,kind=''){$('#sheet').innerHTML=html;$('#sheet').dataset.kind=kind;$('#modal').hidden=false;}
function closeModal(){$('#modal').hidden=true;}
function showResult(){
  if(!G||G.phase!=='end'||!G.lastD) return;
  const d=G.lastD, alone=G.partner===G.caller;
  const cp=G.ptsCap[G.caller]+(alone?0:G.ptsCap[G.partner]), win=cp>=G.target;
  const callerSide=alone?esc(nm(G.caller))+' (da solo)':`${esc(nm(G.caller))} + ${esc(nm(G.partner))}`;
  const defs=[0,1,2,3,4].filter(q=>q!==G.caller&&q!==G.partner).map(q=>esc(nm(q))).join(', ');
  const myWin=seated()?d[ME]>0:win;
  const title=seated()?(myWin?'Mano vinta':'Mano persa'):(win?'Vince il chiamante':'Vincono i difensori');
  const per=[0,1,2,3,4].map(q=>`<tr><td>${esc(nm(q))}${q===G.caller?' · chiamante':q===G.partner?' · socio':''}</td><td class="n">${G.ptsCap[q]}</td><td class="n ${d[q]>0?'pos':'neg'}">${d[q]>0?'+':''}${d[q]}</td></tr>`).join('');
  const host=NET.mode==='solo'||NET.mode==='host';
  openModal(`<h2 class="${myWin?'':'l'}">${title}</h2>
    <p>${win?'Il chiamante raggiunge l\'obiettivo':'Il chiamante non arriva all\'obiettivo'} di ${G.target} punti. Carta chiamata: ${cnHTML(G.calledCard)}, in mano a ${esc(nm(G.partner))}${alone?' (lo stesso chiamante)':''}.</p>
    ${G.bluffs.map(b=>`<p class="note" style="margin:0">${esc(nm(b.p))} aveva chiamato ${RN[AUCT[b.pos]]} di bluff, per spingere l'asta sul ${RN[b.r]} (stimava che il seme giusto venisse chiamato nel ${Math.round(b.ps*100)}% dei casi)${G.partner===b.p?': ed è diventato socio.':'.'}</p>`).join('')}
    <div class="teams"><div class="team"><div class="who">${callerSide}</div><div class="big">${cp}</div></div><div class="team"><div class="who">${defs}</div><div class="big">${120-cp}</div></div></div>
    <table class="sc"><thead><tr><th>Giocatore</th><th style="text-align:right">Prese</th><th style="text-align:right">Esito</th></tr></thead><tbody>${per}</tbody></table>
    <div class="opts">${host?'<button class="btn primary" data-act="next">Prossima mano</button>':''}<button class="btn" data-act="close">Chiudi</button></div>`,'result');
}
function showRules(){
  openModal(`<h2>Regole in breve</h2><ul>
  <li>Mazzo da 40 carte, 5 giocatori, 8 carte a testa. Gioco in senso antiorario: la prima carta la gioca il chiamante.</li>
  <li>Carte siciliane numerate da 1 a 10: Fante 8, Cavallo 9, Re 10.</li>
  <li>Valori: Asso 11, Tre 10, Re 4, Cavallo 3, Fante 2, le altre 0. Totale 120 punti.</li>
  <li>Forza: Asso, Tre, Re, Cavallo, Fante, 7, 6, 5, 4, 2. Non c'è obbligo di rispondere al seme: prende la briscola più alta, altrimenti la carta più alta del seme di uscita.</li>
  <li>Asta al ribasso: si chiama un grado (Asso, Tre, Re… fino al Due), ogni chiamata deve essere più bassa della precedente. Chi passa esce dall'asta.</li>
  <li>Se più giocatori arrivano al Due si continua a punti: "Due a 62", "Due a 63"… Il vincitore deve fare almeno quei punti (di base 61).</li>
  <li>Il vincitore dichiara il seme: diventa briscola e chi ha la carta chiamata è il suo socio segreto. Si scopre solo quando la gioca. Se la carta è del chiamante, gioca da solo.</li>
  <li>Tavolo online: chi possiede la pagina apre il tavolo dalla scheda Tavolo, gli amici si siedono al posto delle CPU. I posti liberi li gioca la CPU.</li>
  </ul><div class="opts"><button class="btn primary" data-act="close">Ho capito</button></div>`);
}

/* Eventi */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-c],[data-tab]'); if(!t||!G) return;
  if(t.dataset.tab){G.tab=t.dataset.tab;renderSide();return;}
  if(t.dataset.c!==undefined){ act({t:'play',c:+t.dataset.c}); return; }
  const a=G.auction, x=t.dataset.act;
  if(x==='bid') act({t:'bid',pos:+t.dataset.pos});
  else if(x==='pass') act({t:'pass'});
  else if(['inc','dec','inc5','dec5'].includes(x) && a){ const step={inc:1,dec:-1,inc5:5,dec5:-5}[x]; NET.hv=Math.min(120,Math.max(a.target+1,NET.hv+step)); renderAction(); }
  else if(x==='bidpts' && a) act({t:'bidpts',T:Math.min(120,Math.max(NET.hv,a.target+1))});
  else if(x==='suit') act({t:'suit',s:+t.dataset.s});
  else if(x==='next' && (NET.mode==='solo'||NET.mode==='host')) newHand();
  else if(x==='close') closeModal();
  else if(x==='result') showResult();
  else if(x==='reads'){G.showReads=!G.showReads;renderSide();}
  else if(x==='host') chooseHost();
  else if(x==='copyinvite'){
    const inp=$('#inviteUrl'), note=$('#inviteNote');
    const done=ok=>{ if(note) note.textContent=ok?'Copiato: incollalo nel messaggio agli amici.':'Selezionalo e copialo a mano.'; };
    try{ navigator.clipboard.writeText(hosted()?inviteUrl():(NET.code||'')).then(()=>done(true),()=>{ if(inp){inp.focus();inp.select();} done(false); }); }
    catch(er){ if(inp){inp.focus();inp.select();} done(false); }
  }
  else if(x==='m-solo') chooseSolo();
  else if(x==='m-host') chooseHost();
  else if(x==='m-join'){ saveNick(); if(!NET.nick){ const el=$('#nick'); if(el){ el.focus(); el.placeholder='Scrivi qui il tuo nome'; } } else chooseJoin(); }
  else if(x==='sitany' && NET.room && G && G.seats){
    NET.autoSit=true; NET.sitAt=0;
    const free=[1,2,3,4].find(q=>G.seats[q].kind==='cpu');
    NET.room.presence({want:1}).catch(()=>{});
    if(free) NET.room.emit('act',{t:'sit',seat:free}).catch(()=>{});
    renderAction();
  }
  else if(x==='m-retry'){ const t=new URLSearchParams(location.search).get('t'); if(t) joinCode(t); }
  else if(x==='m-invite'){
    saveNick();
    if(!NET.nick){ const el=$('#nick'); if(el){ el.focus(); el.placeholder='Scrivi qui il tuo nome'; } }
    else if(NET.hostAvailable){ NET.autoSit=true; chooseJoin(); }
    else { NET.autoJoin=true; NET.autoSit=true; refreshStartMenu(); }
  }
  else if(x==='m-code'){ const el=$('#joincode'); joinCode(el?el.value:''); }
  else if(x==='menu') showStartMenu();
  else if(x==='start' && NET.mode==='host' && G.phase==='lobby') newGame();
  else if(x==='closetable') closeTable();
  else if(x==='kick' && NET.mode==='host'){ const p=+t.dataset.seat; if(p>0&&G.seats[p].kind==='human'){ G.seats[p]={kind:'cpu'}; log(`Il posto ${p+1} torna alla CPU.`,'t'); render(); resumeCpu(); } }
  else if(x==='sit' && NET.room) NET.room.emit('act',{t:'sit',seat:+t.dataset.seat}).catch(er=>{ NET.err='Non è stato possibile sedersi, riprova.'; renderSide(); });
  else if(x==='stand' && NET.room && NET.mode==='client') NET.room.emit('act',{t:'stand'}).catch(()=>{});
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal') closeModal();});
$('#btnRules').addEventListener('click',showRules);
$('#btnMenu').addEventListener('click',()=>showStartMenu());
$('#btnNewHand').addEventListener('click',()=>{ if(NET.mode!=='solo'&&NET.mode!=='host') return; G.handNo--; G.dealer=(G.dealer+4)%5; newHand();});
$('#btnNewGame').addEventListener('click',()=>{ if(NET.mode!=='solo'&&NET.mode!=='host') return; G.seats=G.seats||freshSeats(); newGame();});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});
/* ---- Menu iniziale ---- */
function lobbyG(){
  return {tok:++TOK,scores:[0,0,0,0,0],handNo:0,dealer:4,history:[],tab:'log',showReads:false,budget:280,seats:freshSeats(),
    phase:'lobby',hands:[[],[],[],[],[]],trick:[],seen:new Uint8Array(40),ptsCap:[0,0,0,0,0],caller:-1,partner:-1,calledCard:-1,callPos:-1,trump:-1,target:61,revealed:false,bel:[],log:[],thinking:-1,busy:false,auction:null,turn:-1,bluffs:[],lastD:null,thr:[.52,.52,.5,.54,.51]};
}
function inviteMenuHTML(){
  let st='';
  if(!NET.netChecked||NET.joining) st='Mi collego al tavolo…';
  else if(!NET.room) st=`<span style="color:var(--lose)">Non riesco a collegarmi: ${esc(NET.why||'errore di rete')}.</span>`;
  else if(NET.joinErr) st=`<span style="color:var(--lose)">${esc(NET.joinErr)}</span>`;
  else if(!NET.hostAvailable) st='Collegato. Aspetto che chi ti ha invitato apra il tavolo…';
  else st='Il tavolo è pronto.';
  return `<h2>Ti hanno invitato a giocare</h2>
    <p style="margin:0">Briscola in 5: scrivi il tuo nome ed entra, ti siedi da solo al primo posto libero.</p>
    <div style="display:grid;gap:6px"><label class="lbl" for="nick">Il tuo nome</label>
    <input id="nick" maxlength="24" value="${esc(NET.nick||'')}" placeholder="es. Marco" autocomplete="nickname" style="background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:16px"></div>
    <button class="btn primary" data-act="m-invite" style="padding:12px;font-size:16px">Entra al tavolo</button>
    <p class="note" style="margin:0">${st}</p>
    ${NET.joinErr&&!NET.joining?'<button class="btn" data-act="m-retry">Riprova a collegarti</button>':''}
    <p class="note" style="margin:0"><button class="btn" data-act="m-solo" style="font-size:13px;padding:5px 10px">Oppure gioca da solo contro le CPU</button></p>`;
}
function startMenuHTML(note){
  if(NET.invited) return inviteMenuHTML();
  let net='';
  if(!NET.netChecked) net='<p class="note" style="margin:0">Mi collego al server per il gioco con gli amici…</p>';
  else if(!NET.room) net=`<p class="note" style="margin:0;color:var(--lose)">Gioco con gli amici non disponibile: ${esc(NET.why||'collegamento non riuscito')}.</p>`;
  else net=`<button class="btn" data-act="m-host">Crea un tavolo per gli amici</button>
    <p class="note" style="margin:0">Ottieni un link da mandare agli amici; quando sono seduti avvii tu la partita.</p>
    ${NET.joining?'<p class="note" style="margin:0">Mi collego al tavolo…</p>':''}
    ${NET.hostAvailable&&!NET.joining?`<button class="btn primary" data-act="m-join">Entra nel tavolo</button><p class="note" style="margin:0">${NET.nick?'Sei collegato al tavolo del tuo amico.':'Scrivi il tuo nome qui sopra, poi entra.'}</p>`:''}
    ${NET.autoJoin&&NET.nick&&!NET.hostAvailable&&!NET.joining&&!NET.joinErr?'<p class="note" style="margin:0">Collegato: entro nel tavolo appena chi ospita manda lo stato.</p>':''}
    ${NET.joinErr?`<p class="note" style="margin:0;color:var(--lose)">${esc(NET.joinErr)}</p>`:''}`;
  return `<h2>Come vuoi giocare?</h2>${note?`<p class="note" style="margin:0">${esc(note)}</p>`:''}
    <div style="display:grid;gap:6px"><label class="lbl" for="nick">Il tuo nome al tavolo</label>
    <input id="nick" maxlength="24" value="${esc(NET.nick||'')}" placeholder="es. Baldo" autocomplete="nickname" style="background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit"></div>
    <div style="display:grid;gap:8px"><button class="btn primary" data-act="m-solo">Gioca contro le CPU</button></div>
    <div style="display:grid;gap:8px">${net}</div>`;
}
let menuNote='';
function showStartMenu(note=''){ menuNote=note; openModal(startMenuHTML(note),'start'); }
function refreshStartMenu(){
  if($('#modal').hidden || $('#sheet').dataset.kind!=='start') return;
  const keep={}, act=document.activeElement&&document.activeElement.id;
  for(const id of ['nick','joincode']){ const el=$('#'+id); if(el) keep[id]=el.value; }
  $('#sheet').innerHTML=startMenuHTML(menuNote);
  for(const id in keep){ const el=$('#'+id); if(el) el.value=keep[id]; }
  if(act && $('#'+act)) $('#'+act).focus();
}
function saveNick(){ const el=$('#nick'); if(!el) return; NET.nick=el.value.trim().slice(0,24); try{ localStorage.setItem('b5nick',NET.nick); }catch(e){} if(NET.room) NET.room.presence({name:NET.nick}).catch(()=>{}); }
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='nick') saveNick(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target&&e.target.id==='joincode') joinCode(e.target.value); });
function leaveCurrent(){
  if(NET.mode==='host') closeTable();
  if(NET.mode==='client' && NET.room) NET.room.emit('act',{t:'stand'}).catch(()=>{});
  NET.wantJoin=false;
}
function chooseSolo(){ NET.choseSolo=true; leaveCurrent(); closeModal(); NET.mode='solo'; ME=0; G=lobbyG(); G.seats=freshSeats(); newGame(); }
function chooseHost(){
  if(!NET.room||!NET.owner) return;
  leaveCurrent(); closeModal();
  NET.mode='host'; ME=0; G=lobbyG(); G.tab='net';
  log('Tavolo online aperto: gli amici possono sedersi dalla scheda Tavolo.','k');
  resolveNames(); render(); sendState();
}
function chooseJoin(){
  if(!NET.room) return;
  leaveCurrent(); closeModal();
  NET.wantJoin=true; NET.mode='watch'; ME=0; G=lobbyG(); G.tab='net'; render();
  NET.lastState=0;   // il prossimo aggiornamento di chi ospita riempie la vista
}
G=lobbyG(); render(); showStartMenu();
initNet().finally(()=>{ NET.netChecked=true; refreshStartMenu(); });
</script>

</body>
</html>
