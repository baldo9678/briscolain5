<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Briscola in 5 tra Amici</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: tavolo ovale al centro, quattro CPU ai lati (senso antiorario), mano in basso, diario a destra */
:root{
  --felt:#16473e; --felt-deep:#0c2b26; --panel:#103631; --panel-2:#0d2d29; --line:#2b5c52;
  --rim:#5a3a23; --ink:#efe7d4; --muted:#a6bdb3; --gold:#e3ad4a; --gold-soft:#e3ad4a33;
  --card:#f6eedb; --card-edge:#d6c7a6; --card-ink:#2b2219; --back1:#7d1f26; --back2:#962c31;
  --s-denari:#b9810f; --s-coppe:#b3262b; --s-spade:#1f4f8f; --s-bastoni:#2c7638;
  --win:#86d6a0; --lose:#f0907e;
  --display:'Alegreya SC', Georgia, 'Times New Roman', serif;
  --body:'Alegreya Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html,body{background:var(--felt-deep);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:grid;gap:14px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.2vw,34px);letter-spacing:.01em;margin:0;line-height:1;color:var(--gold)}
.brand .sub{color:var(--muted);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#22180a;font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit}
.lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* Info strip */
.info{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13.5px;white-space:nowrap}
.chip b{font-weight:700}
.chip .k{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.chip.hot{border-color:var(--gold);background:var(--gold-soft)}
.si{width:15px;height:15px;flex:none;vertical-align:-2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.play{display:grid;gap:12px;min-width:0}

/* Table */
.table{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3.3fr) minmax(0,1fr);grid-template-areas:"s3 felt s2" "s4 felt s1";gap:10px 12px;align-items:center}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:grid;gap:6px;min-width:0;transition:border-color .2s, box-shadow .2s}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.seat .nm{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.bdg{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.bdg.caller{border-color:var(--gold);color:var(--gold)}
.bdg.partner{border-color:var(--win);color:var(--win)}
.bdg.alone{border-color:var(--lose);color:var(--lose)}
.backs{display:flex;height:26px;align-items:center}
.mini{width:16px;height:25px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--back1) 0 3px,var(--back2) 3px 6px);border:1.5px solid var(--card);flex:none}
.mini+.mini{margin-left:-9px}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:20px}
.bubble{background:var(--card);color:var(--card-ink);font-weight:700;border-radius:8px;padding:1px 8px;font-size:13px}
.bubble.pass{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:500}
.dots::after{content:'…';animation:blink 1s steps(3) infinite}
@keyframes blink{50%{opacity:.25}}
.s1{grid-area:s1}.s2{grid-area:s2}.s3{grid-area:s3}.s4{grid-area:s4}

.felt{grid-area:felt;position:relative;aspect-ratio:5/4;border-radius:44%/40%;background:radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt) 45%,var(--felt-deep) 100%);border:clamp(6px,1.2vw,12px) solid var(--rim);box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);container-type:inline-size;overflow:hidden}
.emblem{position:absolute;left:50%;top:44%;width:26cqw;height:26cqw;transform:translate(-50%,-50%);opacity:.13;color:var(--ink)}
.emblem svg{width:100%;height:100%}
.bidcenter{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:6px;padding:0 14%}
.bidcenter .bc-k{text-transform:uppercase;letter-spacing:.14em;font-size:clamp(11px,2.4cqw,14px);color:var(--muted)}
.bidcenter .bc-v{font-family:var(--display);font-weight:800;font-size:clamp(30px,11cqw,68px);line-height:1;color:var(--gold);text-wrap:balance}
.bidcenter .bc-who{font-family:var(--display);font-weight:700;font-size:clamp(15px,4cqw,24px);color:var(--ink)}
.bidcenter .bc-turn{font-size:clamp(12px,2.6cqw,14px);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bidcenter .bc-v{animation:pop .25s ease-out}}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.felt .emblem{z-index:0}
.slot{position:absolute;width:min(15cqw,78px);transform:translate(-50%,-50%);transition:transform .25s ease, filter .25s}
.slot.p0{left:50%;top:72%}.slot.p1{left:79%;top:58%}.slot.p2{left:69%;top:22%}.slot.p3{left:31%;top:22%}.slot.p4{left:21%;top:58%}
.slot.win .card{box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.5)}
.slot .who{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.slot{animation:drop .22s ease-out}}
@keyframes drop{from{opacity:0;margin-top:-10px}to{opacity:1;margin-top:0}}

/* Cards */
.card{position:relative;display:block;width:100%;aspect-ratio:186/306;background:var(--card);border:1px solid var(--card-edge);border-radius:8%/5%;box-shadow:0 1px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.35);container-type:inline-size;overflow:hidden;color:var(--card-ink)}
.card .ix{position:absolute;font-family:var(--display);font-weight:800;font-size:30cqw;line-height:1}
.card .tl{top:6cqw;left:8cqw}.card .br{bottom:6cqw;right:8cqw;transform:rotate(180deg)}
.card .pip{position:absolute;left:50%;top:50%;width:54cqw;height:54cqw;transform:translate(-50%,-50%)}
.card .pip.big{width:74cqw;height:74cqw}
.card .pv{position:absolute;top:7cqw;right:8cqw;font-family:var(--body);font-weight:700;font-size:17cqw;color:var(--card-ink);opacity:.45}
.denari{color:var(--s-denari)}.coppe{color:var(--s-coppe)}.spade{color:var(--s-spade)}.bastoni{color:var(--s-bastoni)}
.card.back-card{background:repeating-linear-gradient(45deg,var(--back1) 0 6px,var(--back2) 6px 12px);border-color:var(--card)}
.card .face{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;max-width:none}
.card .num{position:absolute;top:3cqw;left:5cqw;font-family:var(--display);font-weight:800;font-size:19cqw;line-height:1;color:var(--card-ink);opacity:.7}
.card.trump::before{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--gold)}
.card .star{position:absolute;left:50%;bottom:6cqw;transform:translateX(-50%);font-size:16cqw;color:var(--gold);font-weight:800}

/* Action bar */
.action{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.action .msg{font-size:16px}
.action .msg b{color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:700;font-family:var(--display);font-size:16px}
.opt:hover{border-color:var(--gold);color:var(--gold)}
.opt.pass{font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stepper output{min-width:56px;text-align:center;font-family:var(--display);font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.suitbtn{display:inline-flex;align-items:center;gap:8px}
.suitbtn svg{width:22px;height:22px}
.suitbtn small{font-family:var(--body);font-weight:500;color:var(--lose);font-size:12px}

/* Hand */
.handwrap{display:grid;gap:8px}
.mehead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mehead .nm{font-family:var(--display);font-weight:700;font-size:18px}
.mehead.turn .nm{color:var(--gold)}
.secret{font-size:13px;color:var(--win);border:1px dashed var(--win);border-radius:8px;padding:2px 8px}
.hand{display:grid;grid-template-columns:repeat(8,minmax(0,86px));gap:clamp(4px,1vw,10px);justify-content:center}
.hcard{background:none;border:0;padding:0;border-radius:8%/5%;transition:transform .15s ease}
.hcard[disabled]{cursor:default}
.hand.live .hcard:not([disabled]):hover{transform:translateY(-8px)}
.hand.live .hcard:not([disabled]){filter:none}
.hand:not(.live) .hcard{filter:saturate(.85)}

/* Side panel */
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-rows:auto 1fr;min-width:0;max-height:calc(100vh - 120px);position:sticky;top:12px}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.pane{padding:12px 14px;overflow:auto;min-height:0}
.log{display:grid;gap:6px;font-size:14px}
.log .e{padding-bottom:6px;border-bottom:1px solid #ffffff0d}
.log .e.k{color:var(--gold)}
.log .e.t{color:var(--muted);font-size:13px}
.grid40{display:grid;grid-template-columns:24px repeat(10,minmax(0,1fr));gap:3px;font-size:12.5px;font-variant-numeric:tabular-nums}
.grid40 .h{color:var(--muted);text-align:center;font-family:var(--display)}
.grid40 .r{display:flex;align-items:center;justify-content:center}
.cell{text-align:center;padding:4px 0;border-radius:5px;background:var(--card);color:var(--card-ink);font-family:var(--display);font-weight:800}
.cell.out{background:transparent;color:#ffffff38;text-decoration:line-through;font-weight:500}
.cell.mine{box-shadow:inset 0 0 0 2px var(--win)}
.cell.called{outline:2px solid var(--gold);outline-offset:1px}
.trumprow .h svg{filter:drop-shadow(0 0 3px var(--gold))}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.reads{display:grid;gap:14px}
.read h4{margin:0 0 6px;font-family:var(--display);font-size:16px}
.bar{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin-bottom:4px}
.bar .tr{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--gold)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc td,table.sc th{padding:6px 4px;border-bottom:1px solid #ffffff12;text-align:left}
table.sc td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.pos{color:var(--win)}.neg{color:var(--lose)}
.hist{margin-top:14px;display:grid;gap:6px;font-size:13px;color:var(--muted)}

/* Modal */
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:20px 22px;display:grid;gap:12px;max-height:88vh;overflow:auto}
.sheet h2{font-family:var(--display);margin:0;font-size:26px;color:var(--gold);text-wrap:balance}
.sheet h2.l{color:var(--lose)}
.sheet p,.sheet li{margin:0;line-height:1.5}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:6px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.team .big{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.team .who{font-size:13px;color:var(--muted)}

@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}.pane{max-height:420px}}
@media (max-width:620px){
  .table{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"s3 s2" "felt felt" "s4 s1"}
  .seat{padding:7px 9px}.backs{display:none}
  .seat .nm{font-size:16px}
}
</style>

</head>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Briscola in 5</h1><span class="sub">Con gli amici o contro le CPU · asta al ribasso</span></div>
    <div class="controls">
      <label class="lbl" for="speed">Velocità
        <select id="speed"><option value="lenta">Lenta</option><option value="normale" selected>Normale</option><option value="veloce">Veloce</option></select>
      </label>
      <button class="btn" id="btnMenu" type="button">Menu</button>
      <button class="btn" id="btnRules" type="button">Regole</button>
      <button class="btn" id="btnNewHand" type="button">Ridistribuisci</button>
      <button class="btn" id="btnNewGame" type="button">Nuova partita</button>
    </div>
  </header>

  <div class="info" id="info"></div>

  <div class="layout">
    <section class="play">
      <div class="table">
        <div class="seat s3" id="seat3"></div>
        <div class="seat s2" id="seat2"></div>
        <div class="felt" id="felt"></div>
        <div class="seat s4" id="seat4"></div>
        <div class="seat s1" id="seat1"></div>
      </div>
      <div class="action" id="action"></div>
      <div class="handwrap">
        <div class="mehead" id="mehead"></div>
        <div class="hand" id="hand"></div>
      </div>
    </section>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="log" aria-selected="true">Diario</button>
        <button class="tab" role="tab" data-tab="out" aria-selected="false">Carte uscite</button>
        <button class="tab" role="tab" data-tab="reads" aria-selected="false">Letture CPU</button>
        <button class="tab" role="tab" data-tab="score" aria-selected="false">Classifica</button>
        <button class="tab" role="tab" data-tab="net" aria-selected="false">Tavolo</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>

<script>
/* ============================ MOTORE ============================ */
const NAMES=['Tu','Turi','Rosalia','Nenè','Concetta'];
const SUITN=['Denari','Coppe','Spade','Bastoni'], SUITK=['denari','coppe','spade','bastoni'];
const RL=['A','2','3','4','5','6','7','F','C','R'];
const RN=['Asso','Due','Tre','Quattro','Cinque','Sei','Sette','Fante','Cavallo','Re'];
const PR=[11,0,10,0,0,0,0,2,3,4], SR=[10,1,9,2,3,4,5,6,7,8];
const SUIT=new Int8Array(40), PTS=new Int8Array(40), STR=new Int8Array(40);
for(let i=0;i<40;i++){SUIT[i]=(i/10)|0;PTS[i]=PR[i%10];STR[i]=SR[i%10];}
const AUCT=[0,2,9,8,7,6,5,4,3,1]; // A,3,R,C,F,7,6,5,4,2
const cardName=c=>`${RN[c%10]} di ${SUITN[SUIT[c]]}`;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function beats(a,b,t){return SUIT[a]===SUIT[b]?STR[a]>STR[b]:SUIT[a]===t;}
function winIdx(tr,t){let w=0;for(let i=1;i<tr.length;i++) if(beats(tr[i].c,tr[w].c,t)) w=i;return w;}
function canBeat(h,card,t){for(let i=0;i<h.length;i++) if(beats(h[i],card,t)) return true;return false;}

/* Contesto dei rollout: carta chiamata, socio del mondo simulato, se è già uscito */
const RC={cc:-1,partner:-1,caller:-1,rev:true};
const closeVal=(w,team)=>team[(w+4)%5]===team[w]?3:-2; // chi vince apre: conta chi chiude dopo di lui
/* Probabilità che q intervenga: il socio coperto nelle prime mani tende a non scoprirsi */
function threat(q,card,t,hs){
  if(!canBeat(hs[q],card,t)) return 0;
  if(!RC.rev && q===RC.partner && q!==RC.caller && hs[q].length>=5) return 0.45;
  return 1;
}
/* Valore di tenere una briscola: punti medi che porta a fine mano (simulazione di 2000 mani),
   corretto per le briscole più alte ancora in giro. Indice per grado: A,2,3,4,5,6,7,F,C,R */
const KEEP=[21,3.5,20.6,4.6,5.1,5.8,6.1,9.3,12.2,15.2];
function keepVal(c,t,hs,p){
  if(SUIT[c]!==t) return PTS[c]>=10?1.5:0;
  let higher=0;
  for(let q=0;q<5;q++){ if(q===p) continue; for(const x of hs[q]) if(SUIT[x]===t && STR[x]>STR[c]) higher++; }
  let v=KEEP[c%10]; v+= higher===0 ? 3 : -Math.min(4,higher);   // la più alta rimasta vale di più
  if(c%10===0){ for(let q=0;q<5;q++) if(q!==p && hs[q].includes(t*10+2)){ v+=8; break; } }   // l'Asso aspetta il Tre
  return Math.max(2,v);
}
/* Carico tipico che un giocatore può buttare su una presa della sua squadra */
function loadOf(h,t){let m=0;for(const x of h) if(SUIT[x]!==t && PTS[x]>m) m=PTS[x];return m;}
/* Politica euristica dei rollout: conta i carichi che arriveranno dopo, la protezione della presa,
   il valore futuro delle briscole e chi apre/chiude la mano successiva */
function heurPlay(h,p,tr,t,team,hs){
  if(h.length===1) return h[0];
  const L=tr.length, tScale=0.35+h.length/8*0.75;
  const hidden=!RC.rev && p===RC.partner && p!==RC.caller;
  let nT=0; for(const c of h) if(SUIT[c]===t) nT++;
  let best=h[0], bestV=-1e9;
  if(L===0){
    let mateL=0, oppL=0;
    for(let k=1;k<5;k++){const q=(p+k)%5, l=loadOf(hs[q],t); if(team[q]===team[p]) mateL+=l; else oppL+=l;}
    // la mia squadra ha la briscola più alta ancora in gioco?
    let topT=-1, topOwner=-1; for(let q=0;q<5;q++) for(const x of hs[q]) if(SUIT[x]===t && STR[x]>topT){topT=STR[x];topOwner=q;}
    for(const c of h){
      if(p===RC.caller && c===t*10) continue;   // il chiamante non apre di Asso di briscola
      let oppT=0; for(let k=1;k<5;k++){const q=(p+k)%5; if(team[q]!==team[p]) oppT=Math.max(oppT,threat(q,c,t,hs));}
      const pw=1-oppT;

      if(SUIT[c]===t){

          if(csT>=2 && (STR[c]>=6 || topOwner===p)) v+=2+Math.min(3,csT-2)+(topOwner===p?0.25*mateL:0);

      v-=keepVal(c,t,hs,p);

/* Ricerca esatta (alpha-beta a squadre) per il finale */
function exact(hs,tr,turn,t,team,alpha,beta){
  if(tr.length===5){
    const w=tr[winIdx(tr,t)].p; let pts=0; for(const x of tr) pts+=PTS[x.c];
    const add=team[w]?pts:0;
    if(hs[w].length===0) return add;
    return add+exact(hs,[],w,t,team,alpha-add,beta-add);
  }
  const h=hs[turn]; if(h.length===0) return 0;
  const mx=team[turn]===1; let best=mx?-1:1e9;
  for(let i=0;i<h.length;i++){
    const c=h[i]; h.splice(i,1); tr.push({p:turn,c});
    const v=exact(hs,tr,(turn+1)%5,t,team,alpha,beta);
    tr.pop(); h.splice(i,0,c);
    if(mx){if(v>best)best=v; if(best>alpha)alpha=best;} else {if(v<best)best=v; if(best<beta)beta=best;}
    if(alpha>=beta) break;
  }

}

/* Asta: simulazioni Monte Carlo (il chiamante apre) + lettura strutturale delle briscole */
function evalBidding(o,N){
  const mine=G.hands[o], mineSet=new Set(mine), rest=[];
  for(let c=0;c<40;c++) if(!mineSet.has(c)) rest.push(c);
  const res=[0,1,2,3].map(()=>Array.from({length:10},()=>[]));
  const alone=[0,1,2,3].map(s=>AUCT.map(r=>mineSet.has(s*10+r)));
  const owner=new Int8Array(40);
  for(const c of mine) owner[c]=o;
  for(let k=0;k<N;k++){
    shuffle(rest); const base=[]; let i=0;
    for(let q=0;q<5;q++){ if(q===o){base[q]=mine;continue;} base[q]=rest.slice(i,i+8); for(const c of base[q]) owner[c]=q; i+=8; }
    for(let s=0;s<4;s++) for(let pos=0;pos<10;pos++){

      const team=new Int8Array(5); team[o]=1; team[pt]=1;
      RC.cc=cc; RC.partner=pt; RC.caller=o; RC.rev=false;

/* Limite "da giocatore": A+3 scende fino al Due (e oltre a punti), 3 delle 5 briscole alte fino al 7 */
function structLimit(hand){
  let pos=-1, maxT=0, suit=-1;
  const top=[0,2,9,8,7];
  for(let s=0;s<4;s++){
    const has=top.map(r=>hand.includes(s*10+r)), k=has.filter(Boolean).length;
    let nT=0; for(const c of hand) if(SUIT[c]===s) nT++;
    if(has[0]&&has[1]){ pos=9; const m=61+3*(k-2)+Math.max(0,nT-3)*2; if(m>=maxT){maxT=m;suit=s;} }
    else if(k>=3) pos=Math.max(pos,5+(nT>=5?2:0));

/* Modello d'asta (regressione logistica su 6000 mani simulate a chiamata forzata):
   briscole in mano al chiamante + grado chiamato -> probabilità di fare 61 */
const W1=[-2.6488,2.1338,0.2251,1.6399,0.0837,0.2361,0.069,0.383,0.4462,0.7085,0.9684,1.8077,1.4013,0.6694,0.2465,0.2463,0.0834,-0.1375,-0.0816,-0.2022];

function probit(p){let lo=-6,hi=6;for(let i=0;i<40;i++){const m=(lo+hi)/2; if(ncdf(m)<p) lo=m; else hi=m;}return (lo+hi)/2;}
function pModel(hand,s,r,T){
  let z=W1[0]; for(const c of hand) if(SUIT[c]===s) z+=W1[1+c%10];
  if(CALLIDX[r]!==undefined) z+=W1[CALLIDX[r]];
  let side=0; for(const c of hand) if(SUIT[c]!==s && (c%10===0||c%10===2)) side++;

function bestSuitFor(o,pos,T,allowAlone){
  const h=G.hands[o], r=AUCT[pos]; let bs=-1,bp=-1;

    if(r===1 && !h.includes(s*10) && !h.includes(s*10+2)) continue;   // al Due si arriva solo con Asso o Tre del seme
    const p=pModel(h,s,r,T); if(p>bp){bp=p;bs=s;}

/* Letture: probabilità su chi sia il socio */
function initBeliefs(){
  G.bel=[];
  for(let o=1;o<5;o++){
    if(G.hands[o].includes(G.calledCard)){G.bel[o]={known:true};continue;}
    const hyps=[],w=[];
    if(o===G.caller){ for(let q=0;q<5;q++) if(q!==o){hyps.push(q);w.push(1);} }
    else { for(let q=0;q<5;q++) if(q!==o&&q!==G.caller){hyps.push(q);w.push(1);} hyps.push(G.caller); w.push(0.1); }
    normW(w); G.bel[o]={known:false,hyps,w};

function normW(w){let s=0;for(const x of w)s+=x;for(let i=0;i<w.length;i++)w[i]/=s;for(let i=0;i<w.length;i++)w[i]=Math.max(w[i],0.02);s=0;for(const x of w)s+=x;for(let i=0;i<w.length;i++)w[i]/=s;}
/* Segnali: carichi (stessa squadra di chi sta prendendo), tagli e sorpassi (squadra opposta),

function updateBelief(o,X,c,before){
  const b=G.bel[o]; if(!b||b.known||G.revealed) return;
  if(X===o||X===G.caller) return;
  const t=G.trump, tn=8-G.hands[X].length; // numero di mano (1..8) del giocatore X dopo la giocata
  const boost=tn<=3?1.25:1;                  // le prime mani pesano di più
  let W, type, LR;
  if(before.length===0){
    if(SUIT[c]!==t) return;
    W=G.caller; type=1; LR=1.5+(STR[c]>=8?0.4:0);
  } else {
    const wi=winIdx(before,t), wc=before[wi].c; W=before[wi].p;
    let P=0; for(const x of before) P+=PTS[x.c];
    if(beats(c,wc,t)){

      type=-1; LR=1+Math.min(2,s);

    } else if(PTS[c]>=2){ type=1; LR=1+PTS[c]/5.5; }

/* Inferenza bayesiana sul modello di gioco: per ogni ipotesi di socio, quanto è probabile
   che X avrebbe scelto proprio quella carta in mani simulate coerenti con ciò che o sa? */
function inferLik(o,X,c,before,h){
  const cc=G.calledCard, t=G.trump, K=24, my=G.hands[o];
  const pool=[]; for(let x=0;x<40;x++) if(!G.seen[x] && !my.includes(x) && x!==cc) pool.push(x);
  const team=new Int8Array(5); team[G.caller]=1; team[h]=1;
  const sv={...RC}; RC.cc=cc; RC.caller=G.caller; RC.partner=h; RC.rev=false;
  let hit=0;
  for(let k=0;k<K;k++){
    shuffle(pool); let j=0; const hs=[];
    for(let q=0;q<5;q++){
      if(q===o){hs[q]=my.slice();continue;}
      const hh=[]; let need=G.hands[q].length+(q===X?1:0);
      if(q===X){hh.push(c);need--;}
      if(q===h){hh.push(cc);need--;}
      for(let i=0;i<need;i++) hh.push(pool[j++]);
      hs[q]=hh;
    }
    if(heurPlay(hs[X],X,before,t,team,hs)===c) hit++;

function updateBeliefModel(o,X,c,before){
  const b=G.bel[o]; if(!b||b.known||G.revealed||X===o||X===G.caller) return;
  const L=b.hyps.map(h=>G.hands[h].length+(h===X?1:0)>0 && !(h===X && c!==G.calledCard && G.hands[X].length===0)?inferLik(o,X,c,before,h):0);

function pickPartner(o){

  let r=Math.random()*tot; for(let i=0;i<ws.length;i++){ r-=ws[i]; if(r<=0) return b.hyps[i]; }

function sampleWorld(o){

/* Correzioni strategiche alla radice, che i rollout non vedono:
   - il socio coperto non si scopre presto senza una presa ricca (tensione e bluff);
   - nella prima mano i difensori subito dopo il chiamante attaccano invece di lasciar fare a 4° e 5°;
   - il giocatore subito dopo il chiamante evita di prendere mani povere (darebbe la chiusura al chiamante). */
function strategicAdj(o,hand){
  const adj=new Float64Array(hand.length);
  const cc=G.calledCard, t=G.trump, tr=G.trick, f=Math.max(0,(hand.length-3)/5);
  let P=0; for(const x of tr) P+=PTS[x.c];
  const wi=tr.length?winIdx(tr,t):-1, wc=wi>=0?tr[wi].c:-1, wp=wi>=0?tr[wi].p:-1;
  const hiddenPartner=!G.revealed && G.partner===o && o!==G.caller;
  const defender=o!==G.caller && !hand.includes(cc) && (G.revealed?G.partner!==o:true);
  const firstTrick=hand.length===8, afterCaller=tr.length>0 && tr[0].p===G.caller;
  for(let i=0;i<hand.length;i++){
    const c=hand[i], b=wi<0||beats(c,wc,t);
    if(hiddenPartner){
      if(c===cc) adj[i]-=0.11*f*(P+PTS[c]>=15?0.35:1);
      else if(wp===G.caller && !b && PTS[c]>=10 && SUIT[c]!==t) adj[i]-=0.035*f;
    }
    if(defender && firstTrick && afterCaller && (tr.length===1||tr.length===2)){
      if(b && wp===G.caller && (SUIT[c]!==t || KEEP[c%10]<=P+PTS[c]+4)) adj[i]+=0.03+0.002*(P+PTS[c]);
    }

      if(wi>=0 && !b && SUIT[wc]===t && hasSide) adj[i]-=0.06+0.003*KEEP[c%10];
      // briscola alta spesa per poco: tiene conto di quanto porterebbe più avanti
      if(b && hand.length>=4 && !(o===G.caller && STR[c]<=5 && P<7 && tr.length>=1 && tr.length<=3)){ const cost=KEEP[c%10]*(0.6+hand.length/16)-(P+PTS[c]); if(cost>0) adj[i]-=0.008*cost; }
      // il chiamante e il socio non aprono di Asso o Tre di briscola nelle prime mani
      if(wi<0 && STR[c]>=9 && hand.length>=5 && (o===G.caller||G.partner===o)) adj[i]-=0.06;
    }
    // nei tre: niente carichi da primo o con il chiamante ancora da giocare,
    // salvo quando il socio ha già giocato e il carico serve a far uscire una briscola importante
    if(defender && SUIT[c]!==t && PTS[c]>=3){
      const callerAfter=!tr.some(x=>x.p===G.caller);
      if(wi<0 || callerAfter){
        const bait=G.revealed && tr.some(x=>x.p===G.partner);
        let pen=(0.08+0.006*PTS[c])*(b && wi>=0 ? 0.6 : 1)*(hand.length>=4?1:0.4);   // nel finale decide il calcolo esatto
        if(bait) pen*=0.3;
        adj[i]-=pen;
      }
    }
    // nei tre: far uscire briscola a metà mano, con le briscole medie o con la più alta rimasta
    if(defender && wi<0 && SUIT[c]===t && hand.length>=3 && hand.length<=7){
      let outT=0, higher=0;
      for(let r=0;r<10;r++){const x=t*10+r; if(!G.seen[x] && !hand.includes(x)){ outT++; if(STR[x]>STR[c]) higher++; }}
      if(outT>=3){ if(higher===0) adj[i]+=0.06; else if(STR[c]>=6 && STR[c]<=8) adj[i]+=0.045; }
    }
    // chiamante (e socio che sa di esserlo): niente carichi sperando che il compagno prenda.
    // Si carica solo se chi sta prendendo è sicuramente della squadra e la presa non è più a rischio.
    // vale per tutti: chiamante, socio e difensori
    const callerSide=o===G.caller || (G.partner===o && (G.revealed || hand.includes(cc)));
    if(SUIT[c]!==t && PTS[c]>=3 && !(wi>=0 && b)){
      let pT=0;                                            // probabilità che chi sta prendendo sia un mio compagno
      if(wi>=0){
        const bb=G.bel[o], pPartner=q=>{ if(G.revealed) return q===G.partner?1:0; if(!bb||bb.known) return 0; const k=bb.hyps.indexOf(q); return k>=0?bb.w[k]:0; };
        if(callerSide){
          if(wp===G.caller || (G.revealed && wp===G.partner)) pT=1;

      if(after>0){ const ref=wi>=0?wc:c; for(let x=0;x<40 && !beatable;x++) if(!G.seen[x] && !hand.includes(x) && beats(x,ref,t)) beatable=true; }
      let keep=pT*(beatable?0.45:1);                   // quanto è probabile che il carico resti alla squadra
      if(o!==G.caller && wi>=0 && !tr.some(x=>x.p===G.caller)){   // socio con il chiamante ancora da giocare
        const weakW=SUIT[wc]!==t || STR[wc]<=6, callerLast=((o+4-tr.length)%5)===G.caller;
        keep=Math.max(keep, weakW ? (callerLast?0.8:0.6) : 0.35);

    }

    //      quando a terra ci sono meno di 7 punti (così i difensori dopo non caricano) ----
    if(o===G.caller && wi>=0 && tr.length>=1 && tr.length<=3 && hand.length>=3 && hand.length<=6
       && P<7 && SUIT[c]===t && b && STR[c]<=5 && wp!==G.caller){
      adj[i]+=0.15-0.006*STR[c];
    }
    // ---- carichi e briscole secondo la posizione nella mano (1° … 5°) ----
    {
      const pos=tr.length+1, after=[]; for(let k=1;k<=5-pos;k++) after.push((o+k)%5);
      const bb=G.bel[o];
      const pPart=q=>{ if(G.revealed) return q===G.partner?1:0; if(!bb||bb.known) return G.partner===q&&hand.includes(cc)?1:0; const k=bb.hyps.indexOf(q); return k>=0?bb.w[k]:0; };
      // probabilità che q sia mio compagno di squadra
      const mate=q=>{ if(q===o) return 1;
        if(callerSide){ if(q===G.caller) return 1; if(G.revealed||hand.includes(cc)) return q===G.partner?1:0; return pPart(q); }
        return q===G.caller?0:1-pPart(q); };
      const unseenBeats=card=>{ for(let x=0;x<40;x++) if(!G.seen[x] && !hand.includes(x) && beats(x,card,t)) return true; return false; };
      const load=SUIT[c]!==t && PTS[c]>=3;
      const pW=wi<0?0:mate(wp);                                   // chi sta prendendo è dei miei?
      const callerPlayed=tr.some(x=>x.p===G.caller);
      const res=b?c:wc;                                           // la carta che vincerebbe dopo la mia
      const safeAfter=wi>=0||b ? !after.length || !unseenBeats(res) : false;
      // 1° di mano: non si carica mai
      if(pos===1 && load) adj[i]-=0.06+0.008*PTS[c];
      // il chiamante ha aperto o giocato per secondo con un liscio o una briscola bassa: i difensori caricano
      if(!callerSide && (pos===2||pos===3) && load && !b && callerPlayed){
        const ci=tr.findIndex(x=>x.p===G.caller), cc0=tr[ci].c, weak=PTS[cc0]===0 && (SUIT[cc0]!==t || STR[cc0]<=5);
        if(ci<=1 && weak && wp!==G.caller) adj[i]+=0.025;
      }
      // il socio coperto che carica prima del chiamante si fa notare: nelle prime mani costa
      if(o===G.partner && o!==G.caller && !G.revealed && load && !b && !callerPlayed && hand.length>=6) adj[i]-=0.03;
      // 3°: la briscola vale molto
      if(pos===3 && SUIT[c]===t && b){
        if(callerSide && o!==G.caller && tr[0].p===G.caller) adj[i]+=0.03+0.002*P;            // socio che protegge il chiamante
        if(!callerSide && callerPlayed){
          let pPlayed=0; for(const x of tr) if(x.p!==G.caller) pPlayed+=pPart(x.p);
          if(pPlayed>=0.5) adj[i]+=0.035+0.002*P;                                            // 4° e 5° caricano facile
        }
      }
      // 4°: caricare è rischiosissimo, salvo presa sicura dei miei o 5° sicuramente compagno
      if(pos===4 && load && !b){
        const fifth=after[0], ok=pW>=0.8 && (mate(fifth)>=0.8 || !unseenBeats(wc));
        if(!ok) adj[i]-=0.06+0.008*PTS[c];
      }
      if(pos===4 && SUIT[c]===t && b && P>=10 && mate(after[0])<0.5) adj[i]+=0.03;          // briscola col 5° sospetto
      // mano già carica: oltre 25 punti si porta a casa, non si carica ancora
      if(P>=20 && load && !(pW>=0.9 && safeAfter)) adj[i]-=(0.04+0.006*PTS[c])*(P>=25?1.5:1);
      if(P>=25 && b && mate(o)===1 && safeAfter) adj[i]+=0.05;
    }
    // non caricare su chi potrebbe essere il socio: carichi gratis al chiamante
    if(defender && !G.revealed && wi>=0 && wp!==G.caller && wp!==o && !b && PTS[c]>=10 && G.bel[o] && !G.bel[o].known){
      const bb=G.bel[o], k=bb.hyps.indexOf(wp); if(k>=0) adj[i]-=0.08*bb.w[k];
    }
    if(defender && !G.revealed && (G.caller+1)%5===o && tr.length && b && P+PTS[c]<6 && !firstTrick) adj[i]-=0.02;
  }
  return adj;
}
/* ======================================================================
   AGENTE A VALORE ATTESO
   Ogni giocatore sceglie la carta che massimizza:
     punti netti attesi della sua squadra nella presa (contando come risponderanno gli altri)
     − valore futuro della carta che spende
     + vantaggio di chi aprirà la mano dopo.
   Squadre: chi sa (socio, carta già uscita) usa le squadre vere; gli altri usano le loro letture.
   Gli altri rispondono per convenienza: prendono se i punti in gioco valgono più della carta che
   dovrebbero spendere, caricano se credono che la presa resti alla loro squadra.
   ====================================================================== */
const EVP={mv:null};   // mv[p][q]: probabilità, secondo p, che q sia suo compagno (fuori dai mondi simulati)
/* probabilità che q sia compagno di p, nel mondo simulato ma con le conoscenze di p */
function mateView(p,q,team){
  if(p===q) return 1;
  if(RC.rev || p===RC.partner || (p===RC.caller && RC.partner===RC.caller)) return team[p]===team[q]?1:0;
  if(q===RC.caller) return p===RC.caller?1:0;                          // il chiamante è noto a tutti
  if(EVP.mv && EVP.mv[p]) return EVP.mv[p][q];
  return p===RC.caller ? 0.25 : 2/3;                                  // senza letture: uniforme
}
/* valore futuro di una carta: punti che porterà nelle mani che restano se la tengo */
function futureVal(c,t,hs,p,trickPts,team){
  const tricksLeft=hs[p].length;                                      // carte che mi restano dopo questa
  if(tricksLeft<=0) return 0;
  let left=0; for(let q=0;q<5;q++) for(const x of hs[q]) left+=PTS[x];
  const perTrick=left/Math.max(1,tricksLeft);
  if(SUIT[c]===t){
    let higher=0; for(let q=0;q<5;q++){ if(q===p) continue; for(const x of hs[q]) if(SUIT[x]===t && STR[x]>STR[c]) higher++; }
    const pWin=1/(1+0.75*higher);
    let v=pWin*(PTS[c]+1.3*perTrick) - (1-pWin)*PTS[c]*0.5;
    if(higher===0 && tricksLeft>=2){
      let nx=-1, nxOwner=-1;
      for(let q=0;q<5;q++){ if(q===p) continue; for(const x of hs[q]) if(SUIT[x]===t && STR[x]<STR[c] && (nx<0||STR[x]>STR[nx])){ nx=x; nxOwner=q; } }
      for(const x of hs[p]) if(SUIT[x]===t && nx>=0 && STR[x]>STR[nx]) nx=-1;   // la seconda ce l'ho io: nessuna promozione
      if(nx>=0){ const opp=team? team[nxOwner]!==team[p] : true; if(opp) v+=PTS[nx]+0.6*perTrick; }
    }
    return v;
  }
  // carta di seme con punti: se è la più alta rimasta del suo seme può ancora prendere
  if(PTS[c]>=10){
    let higher=0; for(let q=0;q<5;q++){ if(q===p) continue; for(const x of hs[q]) if(SUIT[x]===SUIT[c] && STR[x]>STR[c]) higher++; }
    return higher? 0 : 0.25*perTrick;
  }
  return 0;
}
const sigm=x=>1/(1+Math.exp(-x));
/* la carta più economica (per valore futuro) con cui q batte la carta che sta prendendo */
function cheapestBeat(h,card,t,hs,q,trickPts){
  let best=-1, bc=1e9;
  for(const x of h) if(beats(x,card,t)){ const k=futureVal(x,t,hs,q,trickPts,null)-PTS[x]*0.5; if(k<bc){bc=k;best=x;} }
  return best<0?null:{c:best,cost:bc};
}
/* valore atteso, per p, di giocare la carta c */
function evCard(h,p,c,tr,t,team,hs){
  const L=tr.length;
  let P=0; for(const x of tr) P+=PTS[x.c];
  let cur, pMine;
  if(L===0){ cur=c; pMine=1; }
  else {
    const wi=winIdx(tr,t), wc=tr[wi].c, wp=tr[wi].p;
    if(beats(c,wc,t)){ cur=c; pMine=1; } else { cur=wc; pMine=mateView(p,wp,team); }
  }
  let T=P+PTS[c];
  const others=[]; for(let k=1;k<=4-L;k++) others.push((p+k)%5);
  // le carte di chi gioca dopo: senza la mia e con la mano attuale nel mondo simulato
  for(const q of others){
    const mq=mateView(p,q,team);                                       // q è dei miei?
    const qHolds=mq*pMine+(1-mq)*(1-pMine);                            // q vede la presa della sua squadra
    const hq=hs[q];
    const cb=cheapestBeat(hq,cur,t,hs,q,T);
    if(cb){
      const gain=2*T+3;                                                 // prenderla sposta T punti e dà la mano
      const pTake=(1-qHolds)*sigm((gain-cb.cost)/4);
      pMine=pTake*mq+(1-pTake)*pMine;
      T+=pTake*PTS[cb.c];
      if(pTake>0.5) cur=cb.c;
    }
    // carico di q se crede che la presa resti alla sua squadra
    const qHolds2=mq*pMine+(1-mq)*(1-pMine);
    const ld=loadOf(hq,t);
    if(ld) T+=ld*sigm((qHolds2-0.7)*8)*0.9;
  }
  let v=T*(2*pMine-1);
  v-=futureVal(c,t,hs,p,P,team);
  // chi vince apre la mano dopo; chi chiude (il giocatore prima di lui) è un vantaggio se è un compagno
  const nxtCloserMate=mateView(p,(p+4)%5,team);
  v+=pMine*(nxtCloserMate>0.5?2:-1.5);
  // socio coperto: farsi scoprire presto costa (le letture degli altri migliorano)
  // socio coperto: restare nascosto vale molto se è povero di briscole (ruba punti ai difensori),
  // poco se è ben accompagnato (scoprirsi non espone la squadra). Vale di più nelle prime mani.
  if(!RC.rev && p===RC.partner && p!==RC.caller && c===RC.cc){
    let nT=1; for(const x of h) if(SUIT[x]===t) nT++;                 // briscole del socio, carta chiamata compresa
    const weak=nT<=1?1:nT===2?0.7:nT===3?0.35:0.15;
    v-=([12,8,5,3,2][7-h.length]||1)*weak;
  }
  return v;
}
function heurPlayEV(h,p,tr,t,team,hs){
  if(h.length===1) return h[0];
  let best=h[0], bv=-1e9;
  for(const c of h){
    if(p===RC.caller && c===t*10 && tr.length===0 && h.length>1) continue;   // il chiamante non apre con l'Asso
    const i=h.indexOf(c); h.splice(i,1);
    const v=evCard(h,p,c,tr,t,team,hs);
    h.splice(i,0,c);
    if(v>bv){bv=v;best=c;}
  }
  return best;
}
/* letture fuori dai mondi simulati: per ogni CPU, quanto crede che ognuno sia suo compagno */
function buildMateViews(){
  const mv=[];
  for(let p=0;p<5;p++){
    const row=new Float64Array(5); row[p]=1;
    const b=G.bel&&G.bel[p];
    for(let q=0;q<5;q++){
      if(q===p) continue;
      if(p===G.caller){ row[q]=b&&!b.known? (b.hyps.indexOf(q)>=0? b.w[b.hyps.indexOf(q)] : 0) : 0.25; }
      else if(q===G.caller){ row[q]=0; }
      else { const pp=b&&!b.known&&b.hyps.indexOf(q)>=0? b.w[b.hyps.indexOf(q)] : 1/3; row[q]=1-pp; }
    }
    mv[p]=row;
  }
  return mv;
}


/* Filtro delle mosse evidentemente sbagliate (dominate): si scartano prima del calcolo,
   se resta almeno un'alternativa. Non sono preferenze di stile: sono giocate che regalano punti o briscole. */
function rootMate(o,q){
  if(o===q) return 1;
  const knows=G.revealed || G.hands[o].includes(G.calledCard);
  if(knows){ const side=x=>x===G.caller||x===G.partner; return side(o)===side(q)?1:0; }
  if(q===G.caller) return o===G.caller?1:0;
  const mv=buildMateViews(); return mv[o][q];
}
function dominated(o,hand){
  const t=G.trump, tr=G.trick, pos=tr.length+1, bad=new Set();
  let P=0; for(const x of tr) P+=PTS[x.c];
  const wi=tr.length?winIdx(tr,t):-1, wc=wi>=0?tr[wi].c:-1, wp=wi>=0?tr[wi].p:-1;
  const unseenBeats=card=>{ for(let x=0;x<40;x++) if(!G.seen[x] && !hand.includes(x) && beats(x,card,t)) return true; return false; };
  const cheapSide=hand.filter(x=>SUIT[x]!==t && PTS[x]===0);
  const cheapTrump=hand.filter(x=>SUIT[x]===t && STR[x]<=5);
  for(const c of hand){
    const b=wi<0||beats(c,wc,t);
    // 1. aprire con un carico (Asso o Tre di seme) che qualcuno può prendere, avendo un liscio
    if(pos===1 && SUIT[c]!==t && PTS[c]>=10 && (cheapSide.length||cheapTrump.length) && unseenBeats(c) && hand.length>=3) bad.add(c);
    // 2. briscola sotto una briscola più alta, avendo carte di seme
    if(wi>=0 && SUIT[c]===t && !b && SUIT[wc]===t && hand.some(x=>SUIT[x]!==t) && rootMate(o,wp)<0.9) bad.add(c);
    // 3. Asso, Tre o Re di briscola su una presa povera nelle prime mani, avendo altro
    if(wi>=0 && SUIT[c]===t && STR[c]>=8 && b && P<6 && hand.length>=5 && hand.some(x=>x!==c && (SUIT[x]!==t || STR[x]<STR[c]))) bad.add(c);
    // 5. superare la presa di un compagno sicuro con una briscola alta su pochi punti
    if(wi>=0 && b && SUIT[c]===t && STR[c]>=8 && wp!==o && rootMate(o,wp)>=0.9 && P<10 && hand.some(x=>x!==c && !(SUIT[x]===t&&STR[x]>=8))) bad.add(c);
    // 6. superare con una briscola un compagno sicuro la cui carta nessuno può più battere
    if(wi>=0 && b && SUIT[c]===t && wp!==o && rootMate(o,wp)>=0.9 && !unseenBeats(wc) && hand.some(x=>!beats(x,wc,t))) bad.add(c);
    // 4. da quarto, caricare su una presa che probabilmente è degli avversari, avendo un liscio
    if(pos===4 && SUIT[c]!==t && PTS[c]>=10 && !b && rootMate(o,wp)<0.5 && cheapSide.length) bad.add(c);
  }
  const keep=hand.filter(c=>!bad.has(c));
  return keep.length?keep:hand;
}

/* Decisione CPU: Monte Carlo su mondi coerenti con le letture; finale risolto in modo esatto */
function decide(o){
  const all=G.hands[o]; if(all.length===1) return all[0];
  // il chiamante non apre mai con l'Asso di briscola: serve a schiacciare il Tre
  // l'Asso di briscola del chiamante è il deterrente per schiacciare il Tre: non apre mai con l'Asso,
  // e nelle prime mani lo gioca da dietro solo se a terra c'è il Tre di briscola o una presa da almeno 15 punti
  let aceOk=true;
  if(o===G.caller && all.includes(G.trump*10) && all.length>1){
    if(G.trick.length===0) aceOk=false;
    else if(all.length>=4){
      // l'Asso si gioca solo con almeno 20 punti a terra e se non ho un'altra briscola
      // più alta di tutte quelle che gli avversari possono ancora avere
      const t=G.trump; let P=0; for(const x of G.trick) P+=PTS[x.c];
      const wc=G.trick[winIdx(G.trick,t)].c;
      let topOut=-1; for(let x=t*10;x<t*10+10;x++) if(!G.seen[x] && !all.includes(x) && (topOut<0||STR[x]>STR[topOut])) topOut=x;
      const safeOther=all.some(x=>x!==t*10 && SUIT[x]===t && (topOut<0||STR[x]>STR[topOut]) && beats(x,wc,t));
      aceOk=P>=20 && !safeOther;
    }
  }
  const hand0=aceOk ? all : all.filter(c=>c!==G.trump*10);
  const hand=(!(G.agent&&G.agent[o]==='old') && hand0.length>1)?dominated(o,hand0):hand0;
  if(hand.length===1) return hand[0];
  const nC=hand.length, util=new Float64Array(nC);
  const endgame=Math.max(...G.hands.map(h=>h.length))<=3;
  const t0=performance.now(), budget=G.budget, minS=endgame?40:80, maxS=endgame?400:3000;
  let n=0;
  const isEV=!(G.agent&&G.agent[o]==='old'), pol=isEV?heurPlayEV:heurPlay;
  EVP.mv=isEV?buildMateViews():null;
  RC.cc=G.calledCard; RC.caller=G.caller;
  while(n<maxS && (n<minS || performance.now()-t0<budget)){
    const W=sampleWorld(o); RC.partner=W.partner;
    let soFar=0; for(let q=0;q<5;q++) if(W.team[q]) soFar+=G.ptsCap[q];
    const mineCaller=W.team[o]===1;
    for(let i=0;i<nC;i++){
      const hs=W.hands.map(h=>h.slice()), c=hand[i];
      hs[o].splice(hs[o].indexOf(c),1);
      const tr0=G.trick.map(x=>({p:x.p,c:x.c}));
      RC.rev=G.revealed;
      // ragionamento diretto sulla presa (posizione, letture, risposte degli altri, valore futuro):
      // guida la scelta e toglie il rumore delle simulazioni
      const evNow=isEV?evCard(hs[o],o,c,tr0,G.trump,W.team,hs):0;
      const tr=tr0.slice(); tr.push({p:o,c});
      RC.rev=G.revealed||c===G.calledCard;
      const g=endgame?exact(hs,tr,(o+1)%5,G.trump,W.team,-1,999):rollout(hs,tr,(o+1)%5,G.trump,W.team,pol);
      const cp=soFar+g, myPts=mineCaller?cp:120-cp, win=mineCaller?cp>=G.target:cp<G.target;
      util[i]+=(win?1:0)+0.35*myPts/120+0.008*evNow;
    }
    n++;
  }
  const adj=isEV?new Float64Array(nC):strategicAdj(o,hand);
  let bi=0, bv=-1e9; for(let i=0;i<nC;i++){const v=util[i]/n+adj[i]; if(v>bv){bv=v;bi=i;}}
  return hand[bi];
}

  Object.assign(G,{phase:'deal',trick:[],seen:new Uint8Array(40),ptsCap:[0,0,0,0,0],caller:-1,partner:-1,calledCard:-1,callPos:-1,trump:-1,target:61,revealed:false,bel:[],log:[],thinking:-1,busy:false,auction:null,turn:-1,bluffs:[],lastD:null,thr:[.52,.52,.5,.54,.51]});
  sortHands();
  log(`Mano ${G.handNo}. Distribuisce ${P(G.dealer)}.`,'k');
  render();
  later(startAuction,400);
}
function sortHands(){
  const t=G.trump;
  const f=(a,b)=>{const sa=SUIT[a]===t?-1:SUIT[a], sb=SUIT[b]===t?-1:SUIT[b]; return sa-sb || STR[b]-STR[a];};
  for(const h of G.hands) if(!h.includes(-1)) h.sort(f);
}

/* ---- Asta ---- */
function startAuction(){
  G.phase='auction';
  G.auction={turn:(G.dealer+1)%5,passed:[false,false,false,false,false],pos:-1,target:61,bidder:-1,last:['','','','',''],nb:[0,0,0,0,0]};
  log(`Asta: apre ${P(G.auction.turn)}.`,'t');
  auctionNext(false);
}
function bidLabel(pos,T){return pos<9?RN[AUCT[pos]]:(T>61?`Due a ${T}`:'Due');}
function auctionNext(advance){
  const a=G.auction;
  if(advance){ for(let k=1;k<=5;k++){const q=(a.turn+k)%5; if(!a.passed[q]){a.turn=q;break;}} }
  const active=[0,1,2,3,4].filter(q=>!a.passed[q]);
  if(active.length===0){ log('Passano tutti: si ridistribuisce.','k'); render(); later(newHand,1400); return; }
  if(a.bidder>=0 && active.length===1){ finishAuction(); return; }
  NET.hv=Math.max(NET.hv,a.target+1);
  render();
  cpuAuctionTurn();
}
function cpuAuctionTurn(){
  const a=G.auction; const p=a.turn;
  if(isHuman(p)) return;
  G.thinking=p; render();
  later(()=>{ if(G.phase!=='auction'||G.auction.turn!==p) return; G.thinking=-1; if(isHuman(p)){render();return;} cpuAuction(p);},speed().d);
}
function doBid(p,pos,T){
  const a=G.auction; a.pos=pos; a.target=T; a.bidder=p; a.nb[p]++; a.last[p]=bidLabel(pos,T);
  log(`${P(p)} chiama: <b>${bidLabel(pos,T)}</b>`); auctionNext(true);
}
function doPass(p){const a=G.auction; a.passed[p]=true; a.last[p]='Passo'; log(`${P(p)} passa.`,'t'); auctionNext(true);}
function cpuWants(p,pos,T){return bestSuitFor(p,pos,T,false).p>=G.thr[p];}
const BLUFF_REQ={8:{ns:2,val:0.7},7:{ns:2,val:0.75},6:{ns:2,val:0.95},5:{ns:3,val:1.05},4:{ns:3,val:1.2}};
function suitPower(h,s){let v=0,n=0;for(const x of h) if(SUIT[x]===s){n++;v+=PTS[x]+STR[x]*0.5;} return v+n*3;}
function oppSuitProb(p,bidder,nextR,targets,pos){
  const mine=new Set(G.hands[p]), pool=[]; for(let c=0;c<40;c++) if(!mine.has(c)) pool.push(c);
  const need=26+2*pos; let acc=0, hit=0;
  for(let k=0;k<400 && acc<150;k++){
    shuffle(pool); const h=pool.slice(0,G.hands[bidder].length);
    let best=-1,bv=-1,top=0;
    for(let s=0;s<4;s++){ const pw=suitPower(h,s); if(pw>top) top=pw; if(h.includes(s*10+nextR)) continue; if(pw>bv){bv=pw;best=s;} }
    if(top<need) continue;
    acc++; if(targets.includes(best)) hit++;
  }
  return acc>=25?hit/acc:0;
}
function cpuBluff(p){
  const a=G.auction; if(a.bidder<0 || a.bidder===p) return false;
  const pos=a.pos+1, tp=pos+1; if(tp<3 || tp>7) return false;
  const nextR=AUCT[tp], req=BLUFF_REQ[nextR], h=G.hands[p], targets=[];
  for(let s=0;s<4;s++){
    if(!h.includes(s*10+nextR)) continue;
    let ns=0, hi=0; for(const x of h) if(SUIT[x]===s){ ns++; if(x%10>=7) hi++; }
    const hasA=h.includes(s*10), has3=h.includes(s*10+2);
    const val=0.5+0.25*(ns-1)+(has3?0.3:0)+(hasA?0.3:0)+0.1*hi;
    if(ns>=req.ns && val>=req.val) targets.push(s);
  }
  if(!targets.length) return false;
  const others=[0,1,2,3,4].filter(q=>!a.passed[q] && q!==p && q!==a.bidder);
  if(others.length>1) return false;
  let pSuit=oppSuitProb(p,a.bidder,nextR,targets,a.pos);
  if(others.length===1){ const q=others[0]; pSuit=(pSuit+oppSuitProb(p,q,nextR,targets,a.nb[q]?a.pos:Math.max(0,a.pos-2)))/2; }
  if(pSuit<0.55) return false;
  if(bestSuitFor(p,pos,61,false).p<0.3) return false;
  G.lastBluffP=pSuit;
  return Math.random()<0.85;
}
function cpuAuction(p){
  const a=G.auction;
  if(a.pos<9){ const pos=a.pos+1;
    if(cpuWants(p,pos,61)) doBid(p,pos,61);
    else if(cpuBluff(p)){ G.bluffs.push({p,pos,r:AUCT[pos+1],ps:G.lastBluffP}); doBid(p,pos,61); }
    else doPass(p); }
  else { const T=a.target+1; if(T<=120 && cpuWants(p,9,T)) doBid(p,9,T); else doPass(p); }
}
function finishAuction(){
  const a=G.auction; G.caller=a.bidder; G.callPos=a.pos; G.target=a.target;
  log(`${P(G.caller)} vince l'asta con <b>${bidLabel(a.pos,a.target)}</b>.`,'k');
  G.phase='declare'; render();
  cpuDeclareTurn();
}
function cpuDeclareTurn(){
  const p=G.caller; if(isHuman(p)) return;
  G.thinking=p; render();
  later(()=>{ if(G.phase!=='declare') return; G.thinking=-1; if(isHuman(p)){render();return;}
    let r=bestSuitFor(p,G.callPos,G.target,false); if(r.s<0) r=bestSuitFor(p,G.callPos,G.target,true);
    if(r.s<0){ const h=G.hands[p]; r={s:[0,1,2,3].sort((x,y)=>h.filter(c=>SUIT[c]===y).length-h.filter(c=>SUIT[c]===x).length)[0]}; }
    declare(r.s);},speed().d);
}
function declare(s){
  G.trump=s; G.calledCard=s*10+AUCT[G.callPos];
  G.partner=G.hands.findIndex(h=>h.includes(G.calledCard));
  initBeliefs(); sortHands();
  log(`${P(G.caller)} dichiara ${SS(s)} <b>${SUITN[s]}</b>: carta chiamata ${CN(G.calledCard)}. Obiettivo ${G.target}.`,'k');
  G.phase='play'; G.turn=G.caller;
  log(`Gioco: inizia ${P(G.turn)}.`,'t');
  nextTurn();
}

/* ---- Gioco ---- */
function nextTurn(){
  render();
  const p=G.turn; if(isHuman(p)) return;
  G.thinking=p; render();
  later(()=>{ if(G.phase!=='play'||G.turn!==p||G.busy) return; if(isHuman(p)){G.thinking=-1;render();return;}
    const c=decide(p); G.thinking=-1; playCard(p,c);},speed().d);
}
function playCard(p,c){
  const before=G.trick.slice();
  G.hands[p].splice(G.hands[p].indexOf(c),1);
  G.trick.push({p,c}); G.seen[c]=1;
  let rev=false;
  if(c===G.calledCard && !G.revealed){G.revealed=true;rev=true;}
  if(!rev) for(let o=0;o<5;o++){ if(!isHuman(o)){ updateBelief(o,p,c,before); updateBeliefModel(o,p,c,before); } }
  log(`${P(p)}: ${CN(c)}`);
  if(rev) log(p===G.caller?`${P(p)} gioca la carta chiamata: era da solo!`:`${P(p)} gioca la carta chiamata: è il socio di ${P(G.caller)}.`,'k');
  if(G.trick.length===5){ G.busy=true; render(); later(resolveTrick,speed().t); }
  else { G.turn=(p+1)%5; nextTurn(); }
}
function resolveTrick(){
  const w=G.trick[winIdx(G.trick,G.trump)].p; let pts=0; for(const x of G.trick) pts+=PTS[x.c];
  G.ptsCap[w]+=pts;
  log(`Prende ${P(w)}${pts?` (${pts} punti)`:''}.`,'t');
  G.trick=[]; G.busy=false; G.turn=w;
  if(G.hands[w].length===0){ endHand(); return; }
  nextTurn();
}
function endHand(){
  G.phase='end';
  const alone=G.partner===G.caller;
  const cp=G.ptsCap[G.caller]+(alone?0:G.ptsCap[G.partner]);
  const win=cp>=G.target, d=[0,0,0,0,0];
  for(let q=0;q<5;q++){
    if(q===G.caller) d[q]=(alone?4:2)*(win?1:-1);
    else if(q===G.partner) d[q]=win?1:-1;
    else d[q]=win?-1:1;
  }
  for(let q=0;q<5;q++) G.scores[q]+=d[q];
  G.lastD=d;
  G.history.unshift({n:G.handNo,caller:G.caller,card:G.calledCard,target:G.target,cp,win,d});
  if(G.history.length>30) G.history.pop();
  log(`Fine mano: chiamante ${cp} punti su ${G.target} richiesti. ${win?'Vince il chiamante.':'Vincono i difensori.'}`,'k');
  render(); showResult();
}
/* Riprende il turno se tocca a una CPU (dopo che un giocatore si alza o se ne va) */
function resumeCpu(){
  if(!G||NET.mode==='client'||NET.mode==='watch') return;
  if(G.phase==='auction') cpuAuctionTurn();
  else if(G.phase==='declare') cpuDeclareTurn();
  else if(G.phase==='play' && !G.busy) nextTurn();
}
/* Azioni dei giocatori umani, locali o arrivate dalla rete: sempre verificate */
function applyAction(p,o){
  if(!G||!o||typeof o!=='object') return;
  const a=G.auction;
  if(o.t==='bid' && G.phase==='auction' && a.turn===p && a.pos<9 && Number.isInteger(o.pos) && o.pos>a.pos && o.pos<=9) doBid(p,o.pos,61);
  else if(o.t==='bidpts' && G.phase==='auction' && a.turn===p && a.pos===9 && Number.isInteger(o.T) && o.T>a.target && o.T<=120) doBid(p,9,o.T);
  else if(o.t==='pass' && G.phase==='auction' && a.turn===p) doPass(p);
  else if(o.t==='suit' && G.phase==='declare' && G.caller===p && Number.isInteger(o.s) && o.s>=0 && o.s<4) declare(o.s);
  else if(o.t==='play' && G.phase==='play' && G.turn===p && !G.busy && G.hands[p].includes(o.c)) playCard(p,o.c);
}
function act(o){
  if(NET.mode==='client'){ if(NET.room) NET.room.emit('act',o).catch(()=>{}); }
  else if(NET.mode!=='watch') applyAction(ME,o);
}

/* ============================ RETE ============================ */
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function aesFor(pk){
  const id=pk.x+'.'+pk.y; if(NET.keys.has(id)) return NET.keys.get(id);
  const pub=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:pk.x,y:pk.y,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await crypto.subtle.deriveKey({name:'ECDH',public:pub},NET.kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  NET.keys.set(id,k); return k;
}
const validPk=pk=>pk && typeof pk.x==='string' && typeof pk.y==='string' && pk.x.length<100 && pk.y.length<100;
function seenHex(){let s='';for(let i=0;i<40;i+=4){s+=((G.seen[i]|G.seen[i+1]<<1|G.seen[i+2]<<2|G.seen[i+3]<<3)).toString(16);}return s;}
function pubState(){
  const a=G.auction, end=G.phase==='end';
  return {v:1,hp:NET.pk,n:G.handNo,ph:G.phase,dl:G.dealer,
    se:G.seats.map(s=>s.kind==='human'?{pe:s.peer,by:s.by}:0),
    a:a?{t:a.turn,pa:a.passed.map(Number),p:a.pos,T:a.target,b:a.bidder,l:a.last}:null,
    c:G.caller,tr:G.trump,cc:G.calledCard,cp:G.callPos,T:G.target,rv:G.revealed?1:0,pt:(G.revealed||end)?G.partner:-1,
    k:G.trick.map(x=>[x.p,x.c]),tu:G.turn,bu:G.busy?1:0,th:G.thinking,hc:G.hands.map(h=>h.length),sn:seenHex(),
    lg:G.log.slice(-14).map(e=>[e.html,e.cls]),sc:G.scores,
    hi:G.history.slice(0,5).map(x=>[x.n,x.caller,x.card,x.target,x.cp,x.win?1:0,x.d]),
    end:end?{pc:G.ptsCap,d:G.lastD,bl:G.bluffs.map(b=>[b.p,b.pos,b.r,Math.round(b.ps*100)])}:null};
}
let bTimer=null;
function broadcast(){ if(NET.mode!=='host'||!NET.room) return; if(bTimer) return; bTimer=setTimeout(()=>{bTimer=null; sendState();},120); }
async function sendState(){
  if(NET.mode!=='host'||!NET.room||!G) return;
  NET.room.emit('state',pubState()).catch(()=>{});
  const peers=NET.room.peers();
  for(let p=1;p<5;p++){
    const s=G.seats[p]; if(s.kind!=='human') continue;
    const pr=peers.find(x=>x.peer===s.peer), pk=pr&&pr.presence&&pr.presence.pk; if(!validPk(pk)) continue;
    try{
      const k=await aesFor(pk), iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify({h:G.hands[p],n:G.handNo,s:p})));
      NET.room.emit('hand',{to:s.peer,iv:b64(iv),ct:b64(ct)}).catch(()=>{});
    }catch(e){}
  }
}
function seatOfPeer(peer){return G&&G.seats?G.seats.findIndex(s=>s.kind==='human'&&s.peer===peer):-1;}
function onAct(msg){
  if(NET.mode!=='host'||!G||msg.sameTab) return;
  const o=msg.data; if(!o||typeof o!=='object') return;
  if(o.t==='sit'){
    let s=o.seat;
    if(seatOfPeer(msg.peer)>=0) return;
    if(!Number.isInteger(s)||s<1||s>4||G.seats[s].kind!=='cpu') s=[1,2,3,4].find(q=>G.seats[q].kind==='cpu');
    if(!s){ log('Un amico vuole sedersi, ma il tavolo è al completo.','t'); render(); return; }
    G.seats[s]={kind:'human',peer:msg.peer,by:msg.by||null};
    G.thinking=G.thinking===s?-1:G.thinking;
    log(`${P(s)} si siede al tavolo.`,'t'); resolveNames(); render(); sendState(); return;
  }
  const p=seatOfPeer(msg.peer); if(p<0) return;
  if(o.t==='stand'){ G.seats[p]={kind:'cpu'}; log(`Il posto ${p+1} torna alla CPU.`,'t'); render(); resumeCpu(); return; }
  applyAction(p,o);
}
function autoSeat(){
  if(NET.mode!=='host'||!G||!NET.room) return;
  let ch=false;
  for(const pr of NET.room.peers()){
    if(pr.sameTab||!pr.presence||pr.presence.want!==1||seatOfPeer(pr.peer)>=0) continue;
    const s=[1,2,3,4].find(q=>G.seats[q].kind==='cpu'); if(!s) break;
    G.seats[s]={kind:'human',peer:pr.peer,by:pr.peer}; if(G.thinking===s) G.thinking=-1;
    log(`${P(s)} si siede al tavolo.`,'t'); ch=true;
  }
  if(ch){ resolveNames(); render(); sendState(); }
}
function onPeersChange(ch){
  autoSeat();

    let changed=false;
    for(const l of ch.left){ const p=seatOfPeer(l.peer); if(p>0){ G.seats[p]={kind:'cpu'}; log(`Il posto ${p+1} torna alla CPU.`,'t'); changed=true; } }
    if(changed){ render(); resumeCpu(); }
    if(ch.joined.length) sendState();
  }
  if(!NET.wantJoin && NET.hostPeer && ch.left.some(l=>l.peer===NET.hostPeer)){ NET.hostPeer=null; NET.hostAvailable=false; refreshStartMenu(); }
  if(NET.mode!=='host' && NET.wantJoin && NET.hostPeer && ch.left.some(l=>l.peer===NET.hostPeer)){
    NET.hostPeer=null; NET.hostAvailable=false; NET.wantJoin=false; NET.mode='solo'; ME=0; G=lobbyG(); render(); showStartMenu('Chi ospitava il tavolo l\'ha chiuso.');
  }
  if(G && G.tab==='net') renderSide();
}
function onState(msg){
  if(NET.mode==='host'||msg.sameTab) return;

    const was=NET.hostAvailable; NET.hostAvailable=true; NET.hostPeer=msg.peer; NET.lastState=Date.now();
    if((NET.autoJoin||NET.invited) && NET.nick && NET.mode==='solo' && G && G.phase==='lobby' && !NET.choseSolo){ NET.autoJoin=false; chooseJoin(); }

  const st=msg.data; if(!st||st.v!==1||!Array.isArray(st.hc)||!Array.isArray(st.se)) return;
  NET.hostPeer=msg.peer; NET.lastState=Date.now();
  if(validPk(st.hp)) NET.hostPk=st.hp;

  const prev=G||{};
  const seen=new Uint8Array(40), sn=typeof st.sn==='string'?st.sn:''; for(let i=0;i<10;i++){const v=parseInt(sn[i]||'0',16)||0; for(let b=0;b<4;b++) seen[i*4+b]=(v>>b)&1;}

  G={tok:prev.tok,tab:prev.tab||'net',showReads:false,handNo:st.n,phase:st.ph,dealer:st.dl,
    seats:st.se.map(s=>s?{kind:'human',peer:s.pe,by:s.by}:{kind:'cpu'}),
    auction:st.a?{turn:st.a.t,passed:st.a.pa.map(Boolean),pos:st.a.p,target:st.a.T,bidder:st.a.b,last:st.a.l}:null,
    caller:st.c,trump:st.tr,calledCard:st.cc,callPos:st.cp,target:st.T,revealed:!!st.rv,partner:st.pt,
    trick:(st.k||[]).map(([p,c])=>({p,c})),turn:st.tu,busy:!!st.bu,thinking:st.th,hands,seen,
    log:(st.lg||[]).map(([html,cls])=>({html:esc(html).replace(/&lt;(\/?)b&gt;/g,'<$1b>'),cls:cls==='k'||cls==='t'?cls:''})),scores:st.sc||[0,0,0,0,0],
    history:(st.hi||[]).map(([n,caller,card,target,cp,win,d])=>({n,caller,card,target,cp,win:!!win,d})),
    ptsCap:st.end?st.end.pc:[0,0,0,0,0],lastD:st.end?st.end.d:null,
    bluffs:st.end?(st.end.bl||[]).map(([p,pos,r,ps])=>({p,pos,r,ps:ps/100})):[],bel:[]};
  sortHands();
  resolveNames(); render();
  if(NET.autoSit && !seated() && NET.room && (!NET.sitAt || Date.now()-NET.sitAt>3000)){
    const free=[1,2,3,4].find(q=>G.seats[q].kind==='cpu');
    if(free){ NET.sitAt=Date.now(); NET.room.presence({want:1}).catch(()=>{}); NET.room.emit('act',{t:'sit',seat:free}).catch(()=>{}); }
    else { NET.autoSit=false; NET.err='Il tavolo è al completo: per ora guardi la partita.'; G.tab='net'; }
  }
  if(seated() && NET.autoSit){ NET.autoSit=false; NET.room&&NET.room.presence({want:null}).catch(()=>{}); }
  if(G.phase==='end' && NET.shownEnd!==G.handNo){ NET.shownEnd=G.handNo; showResult(); }
  if(G.phase!=='end' && !$('#modal').hidden && $('#sheet').dataset.kind==='result') closeModal();
}
async function onHand(msg){

/* Rete senza account che funziona su qualsiasi connessione (5G compreso): i messaggi passano da un
   server MQTT pubblico via WebSocket. Chi ospita fa da centro: riceve le azioni, manda lo stato a tutti;
   le mani viaggiano cifrate per ciascun giocatore, quindi il server non le può leggere. */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
async function connectBroker(myId){
  const list=window.B5_BROKERS||BROKERS;
  for(const url of list){
    const c=await new Promise(res=>{
      let done=false; const cl=mqtt.connect(url,{clientId:myId+'-'+Math.random().toString(36).slice(2,7),connectTimeout:8000,reconnectPeriod:2000,clean:true,keepalive:30});
      const t=setTimeout(()=>{ if(!done){ done=true; try{cl.end(true);}catch(e){} res(null); } },9000);
      cl.once('connect',()=>{ if(!done){ done=true; clearTimeout(t); res(cl); } });
    });
    if(c){ NET.broker=url; return c; }
  }
  return null;
}
function makeMqttRoom(cl,myId){
  const handlers={}, peerCbs=[], peersMap=new Map();   // host: id -> {presence,last}
  let myPres={}, hostId=null, list=[], prev=new Map(), lastHost=0, joinWait=null;
  const T=(id,ch)=>`b5v1/${id}/${ch}`;
  const pub=(topic,obj)=>{ try{ cl.publish(topic,JSON.stringify(obj),{qos:0}); }catch(e){} };
  const deliver=(topic,data,from,same)=>{ (handlers[topic]||[]).slice().forEach(f=>{ try{ f({topic,data,peer:from,by:from,isMe:same,sameTab:same,kind:'viewer',guest:false}); }catch(e){} }); };
  const snapshot=()=>{ const arr=[{peer:myId,by:myId,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:myPres,updatedAt:Date.now()}];
    for(const x of list) if(x.peer!==myId) arr.push({peer:x.peer,by:x.peer,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:x.presence||{},updatedAt:Date.now()}); return arr; };
  const firePeers=()=>{ const snap=snapshot(), ids=new Map(snap.map(p=>[p.peer,p]));
    const joined=snap.filter(p=>!prev.has(p.peer)), left=[...prev.values()].filter(p=>!ids.has(p.peer));
    const updated=snap.filter(p=>prev.has(p.peer)&&JSON.stringify(prev.get(p.peer).presence)!==JSON.stringify(p.presence));
    prev=ids; peerCbs.forEach(f=>{ try{ f({peers:snap,joined,left,updated}); }catch(e){} }); };
  const hubPeers=()=>{ list=[{peer:myId,presence:myPres},...[...peersMap].map(([id,v])=>({peer:id,presence:v.presence||{}}))];
    pub(T(myId,'s'),{k:'peers',list}); firePeers(); };
  // sono sempre in ascolto come possibile host
  cl.subscribe(T(myId,'c'));
  cl.on('message',(topic,buf)=>{
    let m; try{ m=JSON.parse(buf.toString()); }catch(e){ return; }
    if(!m||typeof m!=='object') return;
    if(topic===T(myId,'c')){
      const from=typeof m.from==='string'?m.from.slice(0,24):null; if(!from||from===myId) return;
      if(m.k==='pres' && m.presence && typeof m.presence==='object'){ const had=peersMap.has(from); peersMap.set(from,{presence:m.presence,last:Date.now()}); if(!had||JSON.stringify(m.presence)!==m._p) hubPeers(); }
      else if(m.k==='emit' && m.topic==='act'){ const pe=peersMap.get(from); if(pe) pe.last=Date.now(); deliver('act',m.data,from,false); }
      else if(m.k==='bye'){ if(peersMap.delete(from)) hubPeers(); }
    } else if(hostId && topic===T(hostId,'s')){
      lastHost=Date.now(); if(joinWait){ const r=joinWait; joinWait=null; r(); }
      if(m.k==='emit' && (m.topic==='state'||m.topic==='hand')) deliver(m.topic,m.data,hostId,false);
      else if(m.k==='peers' && Array.isArray(m.list)){ list=m.list.slice(0,16); firePeers(); }
    }
  });
  // battito: i giocatori si fanno sentire, l'host toglie chi tace da 20 secondi
  setInterval(()=>{
    if(hostId){ pub(T(hostId,'c'),{k:'pres',from:myId,presence:myPres});
      if(lastHost && Date.now()-lastHost>20000 && list.length){ list=[]; firePeers(); } }
    else { let ch=false; for(const [id,v] of peersMap) if(Date.now()-v.last>20000){ peersMap.delete(id); ch=true; } if(ch||peersMap.size) hubPeers(); }
  },5000);
  addEventListener('pagehide',()=>{ if(hostId) pub(T(hostId,'c'),{k:'bye',from:myId}); });
  return {
    emit:async(topic,data)=>{
      deliver(topic,data,myId,true);
      if(hostId){ if(topic==='act') pub(T(hostId,'c'),{k:'emit',topic,data,from:myId}); return; }
      pub(T(myId,'s'),{k:'emit',topic,data});
    },
    on:(t,f)=>{ (handlers[t]=handlers[t]||[]).push(f); return ()=>{ const a=handlers[t], i=a.indexOf(f); if(i>=0) a.splice(i,1); }; },
    presence:async p=>{ for(const k in p){ if(p[k]===null) delete myPres[k]; else myPres[k]=p[k]; }
      if(hostId) pub(T(hostId,'c'),{k:'pres',from:myId,presence:myPres}); else hubPeers(); },
    peers:()=>snapshot(),
    onPeers:f=>{ peerCbs.push(f); setTimeout(firePeers,0); return ()=>{}; },
    connected:()=>cl.connected,
    onConnection:f=>{ setTimeout(()=>f(cl.connected),0); cl.on('connect',()=>f(true)); cl.on('offline',()=>f(false)); return ()=>{}; },
    connectTo:code=>new Promise((res,rej)=>{
      if(hostId && hostId!==code) cl.unsubscribe(T(hostId,'s'));
      hostId=code; lastHost=0; list=[];
      cl.subscribe(T(code,'s'),()=>{ pub(T(code,'c'),{k:'pres',from:myId,presence:myPres}); });
      joinWait=res;
      setTimeout(()=>{ if(joinWait===res){ joinWait=null; rej({type:'peer-unavailable'}); } },15000);
    }),
  };
}
function userShim(room,myId){
  return {isOwner:async()=>true,canEdit:async()=>true,id:async()=>myId,
    profiles:async ids=>{ const m={}, ps=room.peers();
      for(const id of [].concat(ids)){ const x=ps.find(p=>p.peer===id), n=x&&x.presence&&typeof x.presence.name==='string'?x.presence.name.slice(0,24):'';
        m[id]={id,name:n,avatarUrl:'',color:'#888',email:null,isMe:id===myId,guest:false}; }
      return m; }};
}
async function initNet(){
  if(!window.mqtt){ NET.why='la libreria di collegamento non si è caricata, controlla la connessione'; return; }
  if(!window.crypto||!crypto.subtle){ NET.why='il browser non permette la cifratura: apri la pagina da un indirizzo https'; return; }
  try{
    NET.kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
    const j=await crypto.subtle.exportKey('jwk',NET.kp.publicKey); NET.pk={x:j.x,y:j.y};
  }catch(e){ NET.why='cifratura non disponibile'; return; }
  const id='b5-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>(b%36).toString(36)).join('');
  const cl=await connectBroker(id);
  if(!cl){ NET.why='il server di collegamento non risponde, riprova tra poco'; return; }
  const room=makeMqttRoom(cl,id);
  NET.room=room; NET.code=id; NET.owner=true; NET.myId=id; NET.user=userShim(room,id);
  room.presence({pk:NET.pk,name:NET.nick||''});
  room.on('state',onState); room.on('hand',onHand); room.on('act',onAct);
  room.onPeers(ch=>{ const me=ch.peers.find(x=>x.sameTab); if(me) NET.peer=me.peer; if(NET.mode!=='client'&&NET.mode!=='watch'&&G&&G.seats&&G.seats[0]) G.seats[0].peer=NET.peer; onPeersChange(ch); resolveNames(); });
  setInterval(()=>{ if(NET.mode==='host'){ autoSeat(); sendState(); } else if(NET.hostPeer && Date.now()-NET.lastState>15000 && G && G.tab==='net') renderSide(); },4000);
  const t=new URLSearchParams(location.search).get('t');
  if(t){ NET.invited=true; NET.autoSit=true; joinCode(t); refreshStartMenu(); }
  if(G&&G.tab==='net') renderSide();
}
function joinCode(code){
  code=String(code||'').trim().toLowerCase();
  if(!/^b5-[a-z0-9]{3,12}$/.test(code)){ NET.joinErr='Il codice del tavolo non è valido: ha la forma b5-abc123.'; refreshStartMenu(); return; }
  if(!NET.room||code===NET.code) return;
  NET.joinErr=''; NET.joining=true; NET.autoJoin=true; refreshStartMenu();
  const tryIt=(n)=>NET.room.connectTo(code).then(()=>{ NET.joining=false; NET.joinErr=''; refreshStartMenu(); })
    .catch(e=>{
      const type=e&&e.type;
      if(type==='peer-unavailable'){ NET.joining=false; NET.joinErr='Il tavolo non risponde: chi ti ha invitato deve avere la pagina aperta con il tavolo creato. Quando lo riapre, ricarica questa pagina.'; refreshStartMenu(); return; }
      if(n<2){ NET.joinErr='Collegamento lento, riprovo…'; refreshStartMenu(); return tryIt(n+1); }
      NET.joining=false; NET.autoJoin=false;
      NET.joinErr='Non riesco a raggiungere il tavolo. Controlla la connessione e ricarica la pagina.';
      refreshStartMenu();
    });
  tryIt(0);
}

const vpos=p=>(p-ME+5)%5;
function cardHTML(c,extra=''){
  if(c<0) return `<span class="card back-card"></span>`;
  const tr=SUIT[c]===G.trump?' trump':'';
  return `<span class="card${tr}" aria-label="${cardName(c)}"><img class="face" src="${CARDIMG[c]}" alt="" draggable="false"><span class="num">${c%10+1}</span>${extra}</span>`;
}
function badges(p){
  const b=[];
  if(p===G.caller) b.push(G.revealed&&G.partner===p?'<span class="bdg alone">Da solo</span>':'<span class="bdg caller">Chiamante</span>');
  if(G.revealed && p===G.partner && p!==G.caller) b.push('<span class="bdg partner">Socio</span>');
  if(p===G.dealer) b.push('<span class="bdg">Mazziere</span>');
  if(NET.mode!=='solo' && G.seats && G.seats[p] && G.seats[p].kind==='cpu') b.push('<span class="bdg">CPU</span>');
  return b.join('');
}
function bubble(p){
  if(!G.auction || (G.phase!=='auction'&&G.phase!=='declare')) return '';
  const t=G.auction.last[p]; if(!t) return '';
  return `<span class="bubble${t==='Passo'?' pass':''}">${esc(t)}</span>`;
}
const myTurn=()=>seated() && ((G.phase==='play'&&G.turn===ME&&!G.busy)||(G.phase==='auction'&&G.auction&&G.auction.turn===ME)||(G.phase==='declare'&&G.caller===ME));
function renderInfo(){
  const ch=[];
  if(NET.mode==='host') ch.push(`<span class="chip hot"><span class="k">Tavolo</span><b>online, ospiti tu</b></span>`);
  else if(NET.mode==='client') ch.push(`<span class="chip hot"><span class="k">Tavolo</span><b>online, posto ${ME+1}</b></span>`);
  else if(NET.mode==='watch') ch.push(`<span class="chip"><span class="k">Tavolo</span><b>online, spettatore</b></span>`);
  ch.push(`<span class="chip"><span class="k">Mano</span><b>${G.handNo}</b></span>`);
  if(G.trump>=0){
    ch.push(`<span class="chip hot"><span class="k">Briscola</span>${si(G.trump)}<b>${SUITN[G.trump]}</b></span>`);
    ch.push(`<span class="chip"><span class="k">Chiamata</span>${cnHTML(G.calledCard)}</span>`);
    ch.push(`<span class="chip"><span class="k">Chiamante</span><b>${esc(nm(G.caller))}</b></span>`);
    ch.push(`<span class="chip"><span class="k">Obiettivo</span><b>${G.target}</b></span>`);
  } else if(G.auction && G.auction.bidder>=0){
    ch.push(`<span class="chip hot"><span class="k">Chiamata attuale</span><b>${bidLabel(G.auction.pos,G.auction.target)}</b> · ${esc(nm(G.auction.bidder))}</span>`);
  } else ch.push(`<span class="chip"><span class="k">Briscola</span><b>da dichiarare</b></span>`);
  $('#info').innerHTML=ch.join('');
  const ctl=(NET.mode==='solo'||NET.mode==='host') && G.phase!=='lobby';
  $('#btnNewHand').disabled=!ctl; $('#btnNewGame').disabled=!ctl;
}
function renderSeats(){
  for(let v=1;v<5;v++){
    const p=(ME+v)%5, n=G.hands[p].length, el=$('#seat'+v);
    const isTurn=(G.phase==='auction'&&G.auction&&G.auction.turn===p)||(G.phase==='play'&&G.turn===p&&!G.busy)||(G.phase==='declare'&&G.caller===p);
    el.classList.toggle('turn',!!isTurn);
    const waiting=isTurn && NET.mode!=='solo' && G.seats[p] && G.seats[p].kind==='human';
    el.innerHTML=`<div class="nm">${esc(nm(p))}</div><div class="badges">${badges(p)}</div>
      <div class="backs">${'<span class="mini"></span>'.repeat(n)}</div>
      <div class="meta"><span>${n} ${n===1?'carta':'carte'}</span>${bubble(p)}${G.thinking===p?'<span class="dots">pensa</span>':''}${waiting?'<span class="dots">tocca a lui</span>':''}</div>`;
  }
}
function renderFelt(){
  let h='';
  if(G.trump>=0) h+=`<div class="emblem ${SUITK[G.trump]}"><svg viewBox="0 0 32 32"><use href="#sym-${SUITK[G.trump]}"/></svg></div>`;
  if((G.phase==='auction'||G.phase==='declare') && G.auction){
    const a=G.auction;
    if(G.phase==='declare') h+=`<div class="bidcenter"><span class="bc-k">Vince l'asta</span><span class="bc-v">${bidLabel(a.pos,a.target)}</span><span class="bc-who">${esc(nm(a.bidder))}</span><span class="bc-turn">sceglie il seme</span></div>`;
    else if(a.bidder>=0) h+=`<div class="bidcenter"><span class="bc-k">Chiamata</span><span class="bc-v">${bidLabel(a.pos,a.target)}</span><span class="bc-who">${esc(nm(a.bidder))}</span><span class="bc-turn">Tocca a ${esc(nm(a.turn))}</span></div>`;
    else h+=`<div class="bidcenter"><span class="bc-k">Asta al ribasso</span><span class="bc-v">Nessuna chiamata</span><span class="bc-turn">Tocca a ${esc(nm(a.turn))}</span></div>`;
  }
  const wi=G.busy&&G.trick.length===5?winIdx(G.trick,G.trump):-1;
  G.trick.forEach((x,i)=>{ h+=`<div class="slot p${vpos(x.p)}${i===wi?' win':''}">${cardHTML(x.c)}<span class="who">${esc(nm(x.p))}</span></div>`; });
  $('#felt').innerHTML=h;
}
function renderAction(){
  const a=G.auction; let h='';
  const other=p=>esc(nm(p));
  if(G.phase==='lobby'){
    if(NET.mode==='host'){ const n=G.seats.filter((x,i)=>i>0&&x.kind==='human').length;
      h=`<div class="msg">Tavolo aperto. Invita gli amici con il link qui sotto; i posti liberi li gioca la CPU. ${n?`Seduti: <b>${n}</b>.`:'Nessun amico seduto per ora.'}</div>${inviteHTML()}<div class="opts"><button class="btn primary" data-act="start">Inizia la partita</button></div>`; }
    else if(NET.mode==='client') h=`<div class="msg"><span class="dots">Sei seduto. Aspetta che chi ospita avvii la partita</span></div>`;
    else if(NET.mode==='watch') h=`<div class="msg">${NET.autoSit?'<span class="dots">Ti sto facendo sedere</span>':'Non sei ancora seduto.'}</div><div class="opts"><button class="btn primary" data-act="sitany">Siediti al tavolo</button></div>`;
    else h=`<div class="msg">Scegli come giocare.</div><div class="opts"><button class="btn primary" data-act="menu">Apri il menu</button></div>`;
  }
  else if(G.phase==='deal') h=`<div class="msg dots">Si distribuiscono le carte</div>`;
  else if(G.phase==='auction'){
    if(seated() && a.turn===ME){
      const cur=a.bidder>=0?`Chiamata attuale: <b>${bidLabel(a.pos,a.target)}</b> di ${other(a.bidder)}.`:'Nessuna chiamata finora.';
      if(a.pos<9){
        let o=''; for(let pos=a.pos+1;pos<10;pos++) o+=`<button class="opt" data-act="bid" data-pos="${pos}">${RN[AUCT[pos]]}</button>`;
        h=`<div class="msg">Tocca a te nell'asta. ${cur} Scegli un grado più basso o passa.</div><div class="opts">${o}<button class="opt pass" data-act="pass">Passo</button></div>`;
      } else {
        const v=Math.min(120,Math.max(NET.hv,a.target+1));
        h=`<div class="msg">${cur} Per restare in gara devi chiamare il Due a più punti.</div>
          <div class="stepper"><button class="opt" data-act="dec5">−5</button><button class="opt" data-act="dec">−1</button><output>${v}</output><button class="opt" data-act="inc">+1</button><button class="opt" data-act="inc5">+5</button>
          <button class="btn primary" data-act="bidpts" ${a.target>=120?'disabled':''}>Due a ${v}</button><button class="opt pass" data-act="pass">Passo</button></div>`;
      }
    } else h=`<div class="msg"><span class="dots">${other(a.turn)} valuta la chiamata</span></div>`;
  } else if(G.phase==='declare'){
    if(seated() && G.caller===ME){
      let o=''; for(let s=0;s<4;s++){ const c=s*10+AUCT[G.callPos], mine=G.hands[ME].includes(c);
        o+=`<button class="opt suitbtn" data-act="suit" data-s="${s}">${si(s)}${SUITN[s]}${mine?' <small>(ce l\'hai: da solo)</small>':''}</button>`; }
      h=`<div class="msg">Hai vinto l'asta con <b>${bidLabel(G.callPos,G.target)}</b>. Dichiara il seme: quel seme sarà briscola e chi ha la carta giocherà con te.</div><div class="opts">${o}</div>`;
    } else h=`<div class="msg"><span class="dots">${other(G.caller)} sceglie il seme</span></div>`;
  } else if(G.phase==='play'){
    if(G.busy){ const w=G.trick[winIdx(G.trick,G.trump)].p; let pts=0; for(const x of G.trick) pts+=PTS[x.c];
      h=`<div class="msg">Prende <b>${other(w)}</b>${pts?` · ${pts} punti`:' · nessun punto'}.</div>`; }
    else if(seated() && G.turn===ME) h=`<div class="msg"><b>Tocca a te.</b> ${G.trick.length?'Rispondi alla mano.':'Sei di mano: apri tu.'}</div>`;
    else h=`<div class="msg"><span class="dots">Gioca ${other(G.turn)}</span></div>`;
  } else if(G.phase==='end'){
    const host=NET.mode==='solo'||NET.mode==='host';
    h=`<div class="msg">Mano conclusa.${host?'':' Aspetta che chi ospita il tavolo avvii la prossima mano.'}</div><div class="opts">${host?'<button class="btn primary" data-act="next">Prossima mano</button>':''}<button class="btn" data-act="result">Rivedi risultato</button></div>`;
  }
  $('#action').innerHTML=h;
}

  if(!seated()){ hd.innerHTML=''; mh.innerHTML=`<span class="nm">Stai guardando il tavolo</span>${NET.mode==='watch'?`<button class="btn primary" data-act="sitany">${NET.autoSit?'Ti sto facendo sedere…':'Siediti al tavolo'}</button>`:''}`; return; }
  const live=G.phase==='play'&&G.turn===ME&&!G.busy;
  hd.classList.toggle('live',live);
  hd.innerHTML=G.hands[ME].map(c=>c<0?`<span class="hcard">${cardHTML(-1)}</span>`:`<button class="hcard" type="button" data-c="${c}" ${live?'':'disabled'} aria-label="${cardName(c)}">${cardHTML(c,c===G.calledCard&&G.trump>=0?'<span class="star">★</span>':'')}</button>`).join('');
